<title>Green Flag Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=VT323&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Jersey+10&family=Russo+One&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-screen broadcast. The canvas track fills the frame, TV graphics (pylon, lap bug, booth ticker, radio) float over it, and the hand sits in a band at the bottom. Menus are scrolling pages in the same dark broadcast palette. Single dark look by design. */
:root{color-scheme:dark;
  --bg:#0a0e18;--panel:rgba(9,13,24,.92);--panel2:#121a2c;--panel3:#1a2440;--ink:#eef1f7;--muted:#98a2b8;--line:#26304a;
  --green:#2fb36a;--green-d:#0f5e34;--amber:#e9b52f;--red:#e5484d;--accent:#6ea8ff;
  --card:#f4f5f8;--card-ink:#121722;--card-muted:#5b6476;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.screen{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.page{overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page-in{max-width:1080px;margin:0 auto;padding-block:28px 64px;display:grid;gap:22px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:clamp(44px,8vw,80px);font-weight:800;line-height:.9}
h1 em{font-style:normal;color:var(--green)}
h2{font-size:28px;font-weight:800}
h3{font-size:19px;font-weight:700;letter-spacing:.03em}
p{margin:0;max-width:68ch;line-height:1.55}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.panel{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.btn{background:var(--panel3);border:1px solid var(--line);border-radius:4px;padding:8px 14px;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--green);border-color:var(--green);color:#04150b}
.btn.small{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel3);border:1px solid var(--line);border-radius:3px;padding:3px 9px;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.05em}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.money{font-family:var(--display);font-weight:800;font-size:24px;color:var(--amber);font-variant-numeric:tabular-nums}
.sel{border:2px solid transparent;cursor:pointer;text-align:left}
.sel.on{border-color:var(--green)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--muted);font-weight:700}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
.famdot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
table.calendar tr.done td{color:var(--muted)}table.calendar tr.done td .tier{opacity:.8}table.calendar tr.next td{background:rgba(47,179,106,.14)}
.btn.armed{background:var(--red);border-color:var(--red);color:#fff}
.tier{display:inline-block;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:13px;padding:1px 8px;border-radius:2px;letter-spacing:.05em}
.t-rough{background:var(--red);color:#fff}.t-solid{background:var(--amber);color:#241a00}.t-strong{background:var(--green);color:#04150b}.t-victory{background:#fff;color:#000}

/* Race screen */
#race{background:#0d1420}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.bug{position:absolute;background:var(--panel);border-radius:3px;font-family:var(--display);font-weight:700;text-transform:uppercase}
#pylon{left:max(10px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 10px);width:228px;overflow:hidden;font-size:14px}
#pylon .ph{background:var(--red);color:#fff;padding:4px 8px;display:flex;justify-content:space-between;font-weight:800;letter-spacing:.04em}
#pylon .ph.caution{background:var(--amber);color:#241a00}
#pylon .ph.green{background:var(--green);color:#04150b}
#pylon .pr{display:grid;grid-template-columns:24px 6px 34px 1fr auto;gap:6px;align-items:center;padding:2px 8px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-weight:700;letter-spacing:.02em}
#pylon .pr:hover{background:rgba(255,255,255,.06)}
#pylon .pr.me{background:rgba(47,179,106,.28)}
#pylon .pr .tc{width:6px;height:16px;border-radius:1px}
#pylon .pr .nb{font-family:var(--mono);font-size:12px;color:var(--muted)}
#pylon .pr .gp{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
#pylon .pr .ar{font-size:11px}
#pylon .sep{height:4px;background:rgba(255,255,255,.08)}
#topr{right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:6px;align-items:stretch;background:none}
#lapbug{background:var(--panel);padding:4px 12px;border-radius:3px;display:grid;justify-items:end;line-height:1.05}
#lapbug b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
#lapbug span{font-size:12px;color:var(--muted);letter-spacing:.05em}
.ctl{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:4px 10px;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.05em}
.ctl.on{background:var(--ink);color:var(--bg)}
#flagban{left:50%;top:22%;transform:translateX(-50%);padding:8px 26px;font-size:clamp(26px,5vw,44px);font-weight:800;letter-spacing:.06em;pointer-events:none;border-radius:4px;opacity:0;transition:opacity .25s}
#flagban.show{opacity:1}
#radio{left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 62px);width:min(560px,calc(100% - 32px));background:var(--amber);color:#241a00;padding:8px 12px 10px;border-radius:4px;display:grid;gap:6px;text-transform:none;font-family:var(--body);font-weight:500}
#radio .rw{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.08em;display:flex;justify-content:space-between;gap:8px}
#radio .rl{font-size:15px}
#radio .rb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#radio .rb button{background:#241a00;color:var(--amber);border:0;border-radius:3px;padding:4px 12px;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
#radio .rb button.ig{background:transparent;color:#241a00;border:1px solid #241a00}
#radio .rt{height:3px;background:rgba(0,0,0,.2);border-radius:2px;overflow:hidden}
#radio .rt i{display:block;height:100%;background:#241a00}
#radio.advice{background:#dfe6f3}
#booth{left:50%;transform:translateX(-50%);width:min(760px,calc(100% - 32px));padding:5px 12px;font-family:var(--body);text-transform:none;font-weight:500;font-size:14px;display:flex;gap:10px;align-items:baseline}
#booth b{font-family:var(--display);font-weight:800;text-transform:uppercase;color:var(--amber);letter-spacing:.06em;font-size:13px;flex:none}
#booth span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#res{left:max(10px,env(safe-area-inset-left,0px));display:grid;gap:4px;padding:8px 10px;width:200px;font-size:13px;letter-spacing:.04em}
#res .rr{display:grid;grid-template-columns:62px 1fr 38px;gap:6px;align-items:center}
#res .bar{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
#res .bar i{display:block;height:100%}
#res .pips{display:flex;gap:3px}
#res .pips i{width:14px;height:8px;border-radius:2px;background:rgba(255,255,255,.14)}
#res .pips i.on{background:var(--accent)}
#res .v{font-family:var(--mono);font-size:12px;text-align:right;font-weight:500}
#toast{left:50%;transform:translateX(-50%);padding:8px 18px;font-size:clamp(18px,3vw,26px);font-weight:800;letter-spacing:.04em;pointer-events:none;opacity:0;transition:opacity .2s;text-align:center;line-height:1.05}
#toast small{display:block;font-size:14px;font-family:var(--body);font-weight:500;text-transform:none;letter-spacing:0;margin-top:4px}
#toast.show{opacity:1}
#handband{position:absolute;left:0;right:0;bottom:0;padding:6px max(10px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 8px);background:linear-gradient(180deg,rgba(10,14,24,0),rgba(10,14,24,.92) 34%);display:grid;gap:6px}
#hfilters{display:flex;gap:5px;flex-wrap:wrap;align-items:center;justify-content:center}
#hfilters .chip{cursor:pointer;background:rgba(9,13,24,.85)}
#hfilters .chip.on{background:var(--ink);color:var(--bg)}
#hfilters .drawt{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.05em;color:var(--muted);display:flex;align-items:center;gap:6px;margin-left:8px}
#hfilters .drawt i{display:inline-block;width:80px;height:6px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden}
#hfilters .drawt i b{display:block;height:100%;background:var(--green)}
#hand{display:flex;gap:8px;justify-content:safe center;overflow-x:auto;padding:14px 4px 2px;scrollbar-width:thin}
.hcard{position:relative;flex:none;width:112px;height:150px;background:var(--card);color:var(--card-ink);border:0;border-top:6px solid var(--fc);border-radius:7px;padding:6px 7px 7px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.45);transition:transform .15s,opacity .15s}
.hcard:hover{transform:translateY(-8px)}
.hcard.best{transform:translateY(-10px);box-shadow:0 0 0 3px var(--green),0 6px 16px rgba(0,0,0,.5)}
.hcard.dim{opacity:.42}
.hcard.off{opacity:.55;cursor:not-allowed}
.hcard.off:hover{transform:none}
.hcard .fl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--card-muted)}
.hcard .pc{font-family:var(--display);font-weight:800;font-size:44px;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hcard .pc.hi{color:#178a4c}.hcard .pc.md{color:#a37800}.hcard .pc.lo{color:#c62b2b}
.hcard .pc.na{font-size:14px;line-height:1.1;color:var(--card-muted);font-family:var(--body);font-weight:600;letter-spacing:0}
.hcard .pc.fx{font-size:12px;line-height:1.2;color:var(--card-ink);font-family:var(--body);font-weight:500;letter-spacing:0}
.hcard .ob{display:flex;width:100%;height:6px;border-radius:2px;overflow:hidden;background:#dde1ea}
.hcard .ob u{display:block;height:100%}
.ocs{background:#0e5a30}.os{background:#2fb36a}.on2{background:#e9b52f}.of{background:#e5484d}.ocf{background:#121722}
.hcard .nm{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:16px;line-height:1}
.hcard .ft{display:flex;justify-content:space-between;width:100%;font-family:var(--mono);font-size:10px;color:var(--card-muted);gap:4px}
.hcard .wr{background:#c62b2b;color:#fff;border-radius:2px;padding:0 3px}
.hcard .burn{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:var(--panel3);color:var(--muted);font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.05em;border-radius:3px;padding:0 6px;border:1px solid var(--line);cursor:pointer;white-space:nowrap}
.hcard .burn:hover{color:var(--ink);border-color:var(--red)}
.hcard .burn .tx{margin-left:4px;font-weight:800}
.hcard .burn.live{color:#06210f;background:#9fd0ff;border-color:#9fd0ff}
.hcard kbd{position:absolute;top:-10px;left:-6px;background:var(--panel3);color:var(--ink);font-family:var(--mono);font-size:11px;border-radius:3px;padding:0 5px;border:1px solid var(--line)}
.hcard .bf{position:absolute;top:-10px;right:-6px;background:var(--amber);color:#241a00;font-family:var(--display);font-weight:800;font-size:12px;border-radius:3px;padding:0 5px}
#tip{position:absolute;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px 12px;font-size:13px;display:grid;gap:6px;pointer-events:none;z-index:5}
#tip h4{margin:0;font-family:var(--display);text-transform:uppercase;font-size:18px}
#tip .tr{display:grid;grid-template-columns:12px 1fr auto;gap:6px;align-items:center;font-family:var(--mono);font-size:12px}
#tip .tr i{width:10px;height:10px;border-radius:2px}
#tip .tg{display:flex;flex-wrap:wrap;gap:4px}
#tip .tg span{font-family:var(--mono);font-size:11px;background:var(--panel3);padding:1px 5px;border-radius:2px}
#tip .up{color:#58d68d}#tip .dn{color:#ff7b7f}
#pitbox{left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));padding:14px 16px;display:grid;gap:10px;text-transform:none;font-family:var(--body);font-weight:500;border:2px solid var(--amber)}
#pitbox h3{color:var(--amber)}
#pitbox .po{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#pitbox .po button{background:var(--panel3);border:2px solid var(--line);border-radius:4px;padding:8px;display:grid;gap:2px;text-align:left}
#pitbox .po button.on{border-color:var(--amber)}
#pitbox .po b{font-family:var(--display);text-transform:uppercase;font-size:17px}
#pitbox .po span{font-size:12px;color:var(--muted)}
#pause{position:absolute;left:50%;top:30%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 18px;text-align:center;pointer-events:none;font-family:var(--display);font-size:30px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
#pause small{display:block;font-family:var(--body);font-size:13px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted)}
#gauges{right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:6px;background:none;align-items:flex-end}
.gauge{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 10px 8px;width:214px;display:grid;gap:3px;text-transform:none;font-family:var(--body);font-weight:500}
.gauge.armed{border-color:var(--amber)}
.gauge .gh{display:flex;justify-content:space-between;gap:6px;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.08em;color:var(--muted)}
.gauge .gh b{color:var(--amber)}
.gauge .gc{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:18px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge svg{width:100%;height:auto;display:block}
.gauge .needle{transition:transform .35s ease-out;transform-origin:100px 100px}
.gauge .gv{font-family:var(--display);font-weight:800;font-size:34px;fill:var(--ink);font-variant-numeric:tabular-nums}
.gauge .gs{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.gauge .gtr{font-family:var(--mono);font-size:12px;display:flex;justify-content:space-between;gap:6px}
.gauge .up{color:#58d68d}.gauge .dn{color:#ff7b7f}
.gauge .ob{display:flex;height:6px;border-radius:2px;overflow:hidden;background:rgba(255,255,255,.1)}
.gauge .ob u{display:block;height:100%}
.gauge .gtags{font-family:var(--mono);font-size:11px;color:var(--muted);min-height:28px;line-height:1.3}
.gauge button{background:var(--green);color:#04150b;border:0;border-radius:3px;padding:5px 8px;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:15px}
.gauge button:disabled{background:var(--panel3);color:var(--muted);cursor:not-allowed}
.hcard.armed{transform:translateY(-14px);box-shadow:0 0 0 3px var(--amber),0 6px 16px rgba(0,0,0,.5)}
.hcard{touch-action:pan-x}
.hcard.dragging{opacity:.35}
.dragghost{position:fixed;z-index:60;pointer-events:none;margin:0;transform:rotate(-4deg) scale(1.06);box-shadow:0 0 0 3px var(--amber),0 14px 30px rgba(0,0,0,.6);transition:box-shadow .12s}
.dragghost.willplay{box-shadow:0 0 0 4px var(--green),0 14px 30px rgba(0,0,0,.6)}
.dragghost::after{content:'Drop in hand to cancel';position:absolute;left:50%;top:-30px;transform:translateX(-50%);white-space:nowrap;background:var(--panel3);color:var(--ink);font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.05em;padding:2px 8px;border-radius:3px}
.dragghost.willplay::after{content:'Release to play';background:var(--green);color:#04150b}
body.carddrag #handband{outline:2px dashed rgba(255,255,255,.35);outline-offset:-4px}
body.carddrag.overplay #handband{outline-color:transparent}
.hcard.armed2{box-shadow:0 0 0 3px var(--accent),0 6px 16px rgba(0,0,0,.5)}
@media (max-width:700px){#topr{left:max(10px,env(safe-area-inset-left,0px));flex-wrap:wrap;justify-content:flex-end}#lapbug{margin-right:auto}#lapbug b{font-size:18px}.ctl{padding:3px 7px;font-size:12px}#pylon{top:calc(env(safe-area-inset-top,0px) + 58px)}.gauge{width:168px;padding:5px 8px 6px}.gauge .gc{font-size:15px}.gauge .gtags{display:none}#gauges .gauge+.gauge{display:none}#pylon{width:170px;font-size:12px}#pylon .pr{grid-template-columns:20px 5px 1fr auto;gap:4px}#pylon .pr .nb{display:none}#res{width:150px}.hcard{width:96px;height:132px}.hcard .pc{font-size:36px}#booth{font-size:12px}}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(4,6,12,.7);display:grid;place-items:center;padding:16px;z-index:20}
#modal .mbox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;width:min(920px,100%);max-height:calc(100% - 20px);overflow-y:auto;padding:18px;display:grid;gap:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.stat{display:grid;grid-template-columns:120px 1fr 28px;gap:8px;align-items:center;font-size:14px}
.stat .sb{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
.stat .sb i{display:block;height:100%;background:var(--accent)}
.stat .sv{font-family:var(--mono);text-align:right}
.stat small{grid-column:1/-1;color:var(--muted);font-size:12px;margin-top:-4px}
.slot{display:grid;gap:4px;background:var(--panel3);border:1px dashed var(--line);border-radius:5px;padding:10px}
.slot.full{border-style:solid}
.slot .sn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.slot b{font-family:var(--display);text-transform:uppercase;font-size:17px}
.slot p{font-size:13px}
.minicard{background:var(--card);color:var(--card-ink);border-top:6px solid var(--fc);border-radius:7px;padding:10px 12px;display:grid;gap:6px;text-align:left;min-width:0}
.minicard .nm{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:20px;line-height:1}
.minicard .fl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--card-muted);display:flex;justify-content:space-between}
.minicard p{font-size:13px}
.minicard .rl{font-size:12px;font-style:italic;color:var(--card-muted)}
.minicard.pickable{cursor:pointer;border:2px solid transparent;border-top-width:6px}
.minicard.pickable:hover{border-color:var(--green);border-top-color:var(--fc)}
.arch .minis{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.arch .minis span{font-size:11px;font-family:var(--mono);background:var(--panel3);padding:1px 6px;border-radius:2px}

/* ===== HUD v2: 90s retro dash modules ===== */
:root{--dash:#161b26;--dash2:#1d2432;--bevl:rgba(255,255,255,.13);--bevd:rgba(0,0,0,.6);--lcd:#0d1a12;--lcdi:#a6ff6b;--lcdg:rgba(166,255,107,.09);--plate:#e9b52f;--lcdf:"VT323",var(--mono)}
.mod,#beatclock,.gauge,#focusbar{position:relative;background:linear-gradient(180deg,var(--dash2),var(--dash) 60%);border:2px solid #2c3546;border-radius:7px;box-shadow:inset 0 1px 0 var(--bevl),inset 0 -2px 0 var(--bevd),0 3px 0 #05070c,0 6px 14px rgba(0,0,0,.45)}
.mod::before,#beatclock::before,.gauge::before{content:"";position:absolute;inset:4px;pointer-events:none;background:radial-gradient(circle,#59627a 1.4px,transparent 2px) 0 0/6px 6px no-repeat,radial-gradient(circle,#59627a 1.4px,transparent 2px) 100% 0/6px 6px no-repeat,radial-gradient(circle,#59627a 1.4px,transparent 2px) 0 100%/6px 6px no-repeat,radial-gradient(circle,#59627a 1.4px,transparent 2px) 100% 100%/6px 6px no-repeat}
.plate{position:absolute;left:10px;top:-9px;z-index:1;background:var(--plate);color:#1a1300;padding:0 7px;border-radius:2px;transform:skewX(-14deg);box-shadow:0 2px 0 #6b4d00;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.1em;line-height:15px;white-space:nowrap}
.plate>span{display:inline-block;transform:skewX(14deg)}
.lcd{position:relative;background:var(--lcd);border-radius:4px;box-shadow:inset 0 2px 4px rgba(0,0,0,.8),0 1px 0 var(--bevl);font-family:var(--lcdf);color:var(--lcdi);text-shadow:0 0 6px rgba(166,255,107,.55);line-height:1;overflow:hidden;font-weight:400;font-variant-numeric:tabular-nums}
.lcd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);pointer-events:none}
.lcd .gh{position:absolute;color:var(--lcdg);text-shadow:none}
.dl{position:absolute;right:6px;top:-16px;white-space:nowrap;z-index:3;font-family:var(--display);font-weight:800;font-size:18px;font-style:normal;pointer-events:none;animation:dlup 1.5s ease-out forwards;text-shadow:0 2px 0 #000,0 0 8px currentColor}

@keyframes flb{0%,30%{border-color:#ff6b70;box-shadow:inset 0 1px 0 var(--bevl),0 0 0 2px rgba(255,107,112,.55),0 0 22px rgba(229,72,77,.75)}}
.pv{position:absolute;right:8px;bottom:-9px;z-index:2;background:#0b1020;border:1px solid var(--plate);color:var(--plate);border-radius:3px;padding:0 5px;font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.05em;line-height:15px;white-space:nowrap;text-transform:uppercase}

function standings(g){g=g||G;const P=g.pts||{};return g.cars.map(c=>({c,pts:P[c.id]||0,wins:c.career.swins!=null?c.career.swins:c.career.wins,best:c.career.best})).sort((a,b)=>b.pts-a.pts||b.wins-a.wins||a.best-b.best||a.c.id-b.c.id);}
function myRank(g){return standings(g).findIndex(s=>s.c.isMe)+1;}
function scoreRace(res,fo){const before=myRank();G.pts=G.pts||{};fo.forEach((c,i)=>{G.pts[c.id]=(G.pts[c.id]||0)+PTS(i);});res.pts=PTS(res.finish-1);res.rankBefore=before;res.rank=myRank();res.ptsTotal=G.pts[me().id];}
/* save/continue in browser storage: saved on the garage and reward screens and at the green flag */
const SAVE_KEY='gfd-season-v1';
function saveSeason(){if(!G||(typeof window!=='undefined'&&window.__gfdHeadless)||PRACT)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify({v:1,at:Date.now(),G}));}catch(e){}}
function readSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return s&&s.v===1&&s.G&&s.G.cars?s:null;}catch(e){return null;}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
// your car's stats object is G.stats itself; JSON restores break that link
function relinkG(){const m=G&&G.cars.find(c=>c.isMe);if(m)m.stats=G.stats;ensureColl();ensureDrv();if(typeof ensureCrew==='function')ensureCrew();}
function continueSeason(){
 const s=readSave();if(!s)return false;G=s.G;relinkG();
 if(G.inRace){
  // the page closed mid-race: go back to the state at the green flag and run the race again, on every Stakes setting (board Q48: no)
  const snap=G.snap;G=JSON.parse(snap);G.snap=snap;relinkG();
  G.notice='Your last race was cut off when the page closed, so it starts over from here.';showGarage();return true;
 }
 if(G.reward)showReward();else showGarage();
 return true;
}
function arcTi(i){if(typeof window!=='undefined'&&window.__gfdHeadless)return i;const S=SCHED[(G&&G.sched)||'ovals'],id=S&&S.ids[i],k=id?TRACKS.findIndex(t=>t.id===id):-1;return k>=0?k:i;}

function tossTxt(cd){const t=cd.toss;if(!t)return '';
 return {chain:`Keeps a live combo going if ${FAM[cd.fam].n} chains off it, and points it at what ${cd.n} sets up.`,
  buff:t.fam?`Your next ${FAM[t.fam].n} card in ${TOSS_BUFF.sec} s gets +${TOSS_BUFF.v}.`:'',charge:'One extra Crew Board charge.',draw:'Draw a card right away.',
  focus:`Focus +${Math.round(t.v*100)}%.`,cool:'Heat −1.',setup:'Your Setups stay fresh one more lap.'}[t.k]+(['chain','cool','setup','focus'].includes(t.k)?' (Nothing to feed: an extra charge.)':'');}
/* Does the toss do its main thing right now? (vs. the extra-charge fallback) */
function tossLive(cd){const t=cd.toss,r=race;if(!t||!BAL.tossFx||!r)return false;
 if(t.k==='chain')return !!(r.chainFam&&r.t-r.chainAt<=comboWin()&&LINK[r.chainFam].includes(cd.fam));
 if(t.k==='cool')return r.heat>0;
 if(t.k==='setup')return !!(r.setups&&r.setups.length);
 if(t.k==='focus')return BAL.focusSec&&r.focusMeter<1;
 return true;}
function tossEffect(cd){const t=cd.toss,r=race;if(!t||!BAL.tossFx)return null;r.stats.tossFx=(r.stats.tossFx||0)+1;
 if(!tossLive(cd)){boardAdd(1);return 'Extra Crew Board charge';}
 r.stats.tossLive=(r.stats.tossLive||0)+1;
 if(t.k==='chain'){r.chainFam=cd.fam;r.chainId=cd.id;r.chainAt=r.t;return `Combo kept alive · next: ${LINK[cd.fam].map(f=>FAM[f].n).join(' / ')}`;}
 if(t.k==='buff'){r.tossBuffs=(r.tossBuffs||[]).filter(b=>b.fam!==t.fam);r.tossBuffs.push({fam:t.fam,v:TOSS_BUFF.v,src:`Tossed ${cd.n}`,until:r.t+TOSS_BUFF.sec});return `Next ${FAM[t.fam].n} card +${TOSS_BUFF.v}`;}
 if(t.k==='charge'){boardAdd(1);return 'Extra Crew Board charge';}
 if(t.k==='draw'){draw(1,true);return 'Drew a card';}
 if(t.k==='focus'){const add=Math.min(t.v,1-r.focusMeter);r.focusMeter+=add;r.stats.focusGain=(r.stats.focusGain||0)+add;r.focusNote={t:performance.now(),txt:`<b>+${Math.round(add*100)}%</b> from tossing ${esc(cd.n)}`};return `Focus +${Math.round(add*100)}%`;}
 if(t.k==='cool'){r.heat=Math.max(0,r.heat-1);r.heatAt=r.t;return 'Heat −1';}
 if(t.k==='setup'){const lap=lapOf(meCar());r.setupFresh=Math.min(lap,(r.setupFresh==null?lap:r.setupFresh)+1);if(typeof setupsRender==='function')setupsRender();return 'Setups stay fresh one more lap';}

/* Car setup: three garage dials that tune the deck for the next race.
   Handling: Tight (-) favors Defending and Car cards and saves tires; Loose (+) favors Passing and High-risk cards and eats tires.
   Aero: Downforce (-) is quicker where the draft is weak and helps corner moves; Low drag (+) feeds the draft and is quicker on big tracks.
   Package: one combo type gets a longer window and a bigger bonus; every other chain gets a shorter window. */
const TUNE={
 hand:{n:'Handling',lo:'Tight',hi:'Loose',
  draw:(v,f)=>v>0?(['pass','risk'].includes(f)?1+0.25*v:['defend','car'].includes(f)?1-0.12*v:1):v<0?(['defend','car'].includes(f)?1-0.25*v:['pass','risk'].includes(f)?1+0.12*v:1):1,
  read:(v,cd)=>v>0?(['pass','risk'].includes(cd.fam)?2*v:0):v<0?(['defend','car'].includes(cd.fam)?-3*v:['pass','risk'].includes(cd.fam)?v:0):0,
  wear:v=>v>0?1+0.05*v:1+0.08*v},
 aero:{n:'Aero',lo:'Downforce',hi:'Low drag',
  draw:(v,f)=>v>0?(f==='draft'?1+0.25*v:1):v<0?(f==='pass'?1-0.1*v:f==='draft'?1+0.12*v:1):1,
  read:(v,cd,c)=>v>0?(cd.fam==='draft'?2*v:0):v<0&&cd.fam==='pass'&&c&&c.seg&&(c.seg.turn||c.seg.approach)?-3*v:0,
  pace:(v,t)=>1+0.0025*v*t.draftBias-(v<0?0.001*-v*Math.max(0,t.draftBias):0),
  draft:v=>1+0.1*v,wear:v=>v<0?1+0.03*v:1},
 focus:{n:'Combo focus'}
};
const FOCUS={
 draft:{n:'Draft focus',fams:['draft'],read:(cd,t)=>cd.fam==='draft'&&t.draftBias>0?Math.round(6*t.draftBias):0,txt:'Drafting cards drawn +40%, and +1 to +6 on tracks with a real draft (most at superspeedways). Drafting chains: +3 s combo window and +2 per link.',draw:1.4},
 bumper:{n:'Bumper focus',fams:['pass','defend'],txt:'Passing and Defending chains: +3 s window and +2 per link. Heat cools faster.',heatCool:1.5},
 longrun:{n:'Long-run focus',fams:['car'],txt:'Chains that start with a Car card: +3 s window and +2 per link. Tire wear −5%.',wear:0.95},
 restart:{n:'Restart focus',fams:['restart','pit'],txt:'Caution and Restart cards drawn +50%. Their chains get +2 per link, and any combo freezes under yellow instead of timing out.',freeze:1,draw:1.5}
};
const TUNE_WIN=3,TUNE_OFF=1,TUNE_BONUS=2;
/* In a race the tune is a copy (race.tune), so pit Setups can nudge it for that race only. The garage edits G.tune. */
const tuneOf=()=>(race&&race.tune&&screen==='race'?race.tune:(G&&G.tune))||{hand:0,aero:0,focus:null};
function tuneDraw(f,u){u=u||tuneOf();const p=FOCUS[u.focus];return TUNE.hand.draw(u.hand,f)*TUNE.aero.draw(u.aero,f)*(p&&p.draw&&p.fams.includes(f)?p.draw:1);}
function tunePace(t,u){return TUNE.aero.pace((u||tuneOf()).aero,t);}
function tuneWear(u){u=u||tuneOf();return TUNE.hand.wear(u.hand)*TUNE.aero.wear(u.aero)*((FOCUS[u.focus]&&FOCUS[u.focus].wear)||1);}
function focusHas(f){const p=FOCUS[tuneOf().focus];return !!(p&&f&&p.fams.includes(f));}
function comboWin(){const r=race;if(!r||!r.chainFam||!tuneOf().focus)return BAL.comboWin;const root=r.chainRoot||r.chainFam;return BAL.comboWin+(focusHas(root)?(FOCUS[tuneOf().focus].freeze?0:TUNE_WIN):-TUNE_OFF);}
function setTune(u){if(!G)return;G.tune=Object.assign({hand:0,aero:0,focus:null},G.tune||{},u||{});G.tune.hand=clamp(G.tune.hand,-2,2);G.tune.aero=clamp(G.tune.aero,-2,2);}
function tuneLabel(u){u=u||tuneOf();const d=(k,v)=>v===0?'Neutral':(v<0?TUNE[k].lo:TUNE[k].hi)+(Math.abs(v)>1?' ++':' +');return `${d('hand',u.hand)} · ${d('aero',u.aero)} · ${FOCUS[u.focus]?FOCUS[u.focus].n:'No combo focus'}`;}
function tuneFx(u){u=u||tuneOf();const out=[];const pct=x=>(x>=1?'+':'−')+Math.round(Math.abs(x-1)*100)+'%';
 const fams=['draft','pass','defend','car','risk'];const dr=fams.map(f=>[f,tuneDraw(f,u)]).filter(x=>Math.abs(x[1]-1)>0.01);
 if(dr.length)out.push(['Draws',dr.map(([f,m])=>`${FAM[f].n} ${pct(m)}`).join(', ')]);
 const od=[];if(u.hand>0)od.push(`Passing & High risk +${2*u.hand}`);if(u.hand<0)od.push(`Defending & Car +${-2*u.hand}, Passing ${u.hand}`);if(u.aero>0)od.push(`Drafting +${2*u.aero}`);if(u.aero<0)od.push(`Passing in corners +${-3*u.aero}`);
 if(od.length)out.push(['Odds',od.join(', ')]);
 const w=tuneWear(u);if(Math.abs(w-1)>0.005)out.push(['Tire wear',pct(w)]);
 if(u.aero)out.push(['Speed',TRACKS.map(t=>`${t.short} ${((tunePace(t,u)-1)*100>=0?'+':'')}${((tunePace(t,u)-1)*100).toFixed(1)}%`).join(' · ')]);
 if(FOCUS[u.focus])out.push(['Combo focus',FOCUS[u.focus].txt+(FOCUS[u.focus].freeze?'':` Other chains −${TUNE_OFF} s.`)]);
 return out;}

/* Collection and race deck (step 15b, board Q19). G.coll keeps every card you own; G.deck is the race deck you build from it before each race.
   Rules (Conner, Oct 27): at least 12 cards, at most 16 for a stock car (CAR_TYPES; later series bring their own); Aero moves the max:
   Downforce +1 per notch (more grip, room for more tools), Low drag −1 per notch (a lean car). A family minimum for each track, and slot caps that your tune moves:
   Attack (Passing + High risk) 6 + Handling, Defense (Defending + Car) 6 − Handling, Drafting 5 + Aero; the combo focus adds 1 slot to its group.
   A minimum or the size floor relaxes when your collection can't meet it. */
const CAR_TYPES={stock:{n:'Stock car',min:12,max:16}};
const carType=()=>CAR_TYPES[(G&&G.carType)||'stock'];
function deckSize(u){u=u||(G&&G.tune)||{hand:0,aero:0,focus:null};const ct=carType();return {min:ct.min,max:ct.max-u.aero};}
// harness (Oct 27): a full auto deck beat a 12-card one by ~0.8 places, so auto-build fills to the max
const SLOT={attack:{n:'Attack',fams:['pass','risk'],base:6},defense:{n:'Defense',fams:['defend','car'],base:6},draft:{n:'Drafting',fams:['draft'],base:5}};
const FOCUS_SLOT={draft:'draft',bumper:'attack',longrun:'defense'};
const TRACK_MIN={mill:{defend:2},carver:{car:2},talon:{draft:3},pine:{pass:2},ridge:{car:2}};
const slotOf=f=>Object.keys(SLOT).find(k=>SLOT[k].fams.includes(f))||null;
const cnt=(arr,id)=>arr.reduce((n,x)=>n+(x===id),0);
const famCount=(arr,f)=>arr.reduce((n,id)=>n+(CARDS[id].fam===f),0);
function slotCaps(u){u=u||(G&&G.tune)||{hand:0,aero:0,focus:null};const c={attack:SLOT.attack.base+u.hand,defense:SLOT.defense.base-u.hand,draft:SLOT.draft.base+u.aero};if(FOCUS_SLOT[u.focus])c[FOCUS_SLOT[u.focus]]++;return c;}
const slotUsed=(deck,k)=>deck.reduce((n,id)=>n+(SLOT[k].fams.includes(CARDS[id].fam)),0);
function deckRules(t,deck,u){deck=deck||G.deck;const caps=slotCaps(u),coll=G.coll||G.deck,out=[];
 const reach=Object.keys(SLOT).reduce((n,k)=>n+Math.min(caps[k],coll.filter(id=>SLOT[k].fams.includes(CARDS[id].fam)).length),0)+coll.filter(id=>!slotOf(CARDS[id].fam)).length;
 const sz=deckSize(u),lo=Math.min(sz.min,reach);
 out.push({k:'size',ok:deck.length>=lo&&deck.length<=sz.max,txt:`${carType().n}: ${lo}–${sz.max} cards${lo<sz.min?` (your cards fit only ${lo} with this tune)`:''}${(u||G.tune).aero?' (Aero moves the max)':''}`,have:deck.length,need:lo,max:sz.max});
 for(const [f,n] of Object.entries(TRACK_MIN[t.id]||{})){const need=Math.min(n,famCount(coll,f));out.push({k:'min',f,ok:famCount(deck,f)>=need,txt:`${t.short}: at least ${need} ${FAM[f].n}${need<n?` (you own ${need})`:''}`,have:famCount(deck,f),need});}
 for(const k of Object.keys(SLOT))out.push({k:'cap',slot:k,ok:slotUsed(deck,k)<=caps[k],txt:`${SLOT[k].n} slots (${SLOT[k].fams.map(f=>FAM[f].n).join(' + ')})`,have:slotUsed(deck,k),need:caps[k]});
 return out;}
const deckOk=(t,deck,u)=>deckRules(t,deck,u).every(r=>r.ok);
// why a card can't go in (null = it can)
function addBlock(id,t,deck,u){deck=deck||G.deck;if(cnt(deck,id)>=cnt(G.coll,id))return 'All your copies are in the deck';{const mx=deckSize(u).max;if(deck.length>=mx)return `The deck is full (${mx})`;}
 const s=slotOf(CARDS[id].fam);if(s&&slotUsed(deck,s)>=slotCaps(u)[s])return `${SLOT[s].n} slots are full. Change your tune for more.`;return null;}
// how good a card is for this track and tune: rarity, track minimum, track shape, tune draw weight, your own success with it
function cardScore(id,t,u){const cd=CARDS[id],f=cd.fam,h=G.hist[id];let s={common:1,uncommon:1.6,rare:2.2,special:1.8}[cd.rar]||1;
 if((TRACK_MIN[t.id]||{})[f])s+=0.8;if(f==='draft')s+=t.draftBias;if(f==='defend')s+=0.8*(t.contact-1);if(f==='car')s+=0.8*(t.wear-0.9);if(f==='pass')s+=0.5*(t.handlingW-1)*0.5;
 s+=0.6*(tuneDraw(f,u||G.tune)-1);if(ARCH[G.arch].add.includes(id))s+=0.3;if(h&&h.plays>=3)s+=(h.succ/h.plays-0.5);return s;}
function byScore(ids,t,u){return [...ids].sort((a,b)=>cardScore(b,t,u)-cardScore(a,t,u)||a.localeCompare(b));}
// keep what you have where it's legal, then meet the minimums, then fill to size
function fixDeck(t,deck,u,target){deck=[...(deck||G.deck)].filter(id=>CARDS[id]);const caps=slotCaps(u);
 for(const id of [...new Set(deck)])while(cnt(deck,id)>cnt(G.coll,id))deck.splice(deck.lastIndexOf(id),1);
 for(const k of Object.keys(SLOT))while(slotUsed(deck,k)>caps[k]){const w=byScore(deck.filter(id=>SLOT[k].fams.includes(CARDS[id].fam)),t,u).pop();deck.splice(deck.lastIndexOf(w),1);}
 const spare=()=>byScore(G.coll.filter((id,i)=>G.coll.indexOf(id)===i).flatMap(id=>Array(Math.max(0,cnt(G.coll,id)-cnt(deck,id))).fill(id)),t,u);
 const rules=()=>deckRules(t,deck,u);
 // a minimum the deck can't take yet (full deck or full slot): drop the weakest card in the way, then add
 for(const r of rules().filter(r=>r.k==='min'))while(famCount(deck,r.f)<r.need){const c=spare().find(id=>CARDS[id].fam===r.f);if(!c)break;
  if(!addBlock(c,t,deck,u)){deck.push(c);continue;}
  const s=slotOf(r.f),slotFull=s&&slotUsed(deck,s)>=caps[s],w=byScore(deck.filter(id=>CARDS[id].fam!==r.f&&(!slotFull||SLOT[s].fams.includes(CARDS[id].fam))),t,u).pop();
  if(!w)break;deck.splice(deck.lastIndexOf(w),1);}
 const mx=deckSize(u).max,lo=rules()[0].need,want=Math.max(lo,Math.min(mx,target||lo));
 while(deck.length<want){const c=spare().find(id=>!addBlock(id,t,deck,u));if(!c)break;deck.push(c);}
 const mins=TRACK_MIN[t.id]||{};
 while(deck.length>mx){const w=byScore(deck.filter(id=>!(mins[CARDS[id].fam]&&famCount(deck,CARDS[id].fam)<=mins[CARDS[id].fam])),t,u).pop();deck.splice(deck.lastIndexOf(w),1);}
 return deck;}
function autoDeck(t,u){return fixDeck(t,[],u,deckSize(u).max);}
// old saves and new careers: everything in the deck is in the collection
function ensureColl(){if(G&&!G.coll)G.coll=[...G.deck];if(G&&!G.trackDecks)G.trackDecks={};}

function autoMove(car){

 const autoPass=!car.isMe||G.diff==='easy';

  let read=46+(paceMult(car)-paceMult(a))*900+(car.stats.racecraft-a.stats.defense)*3-(race.track.passDiff-1)*25+shapeAI(car);

  if(car.trait==='closer'&&leader().dist>race.track.laps*0.8)read+=10;

/* ================= pit road, fuel and cautions =================
   Cars really drive down pit road: they leave the track at pit entry, slow to the speed limit, stop in their stall,
   and rejoin at pit exit, so track position falls out of the time they lose. Everyone needs at least one stop for fuel.
   Under caution the field forms up behind the pace car, pit road opens the next time by, cars that stay out keep
   track position, and at one to go the free pass (lucky dog) and the wave-around send lapped cars to the tail. */
const PIT={fuelRange:{mill:14,carver:10,talon:6,pine:10,ridge:6},limit:0.42,pace:0.55,tireT:{fuel:0,two:6.5,four:11.5},fuelT:6,fuelBase:1.5,cautionBurn:0.35,warp:2.5,openAfter:0.3,

function sOf(d){return d-Math.round(d);}
function crossedAt(pd,d,s0){return Math.floor(pd-s0)<Math.floor(d-s0);}
function pitGeom(t){const P=perim(t),h=Math.min(t.S/2-0.12,0.8);return {E0:-(h+0.45)/P,E1:-h/P,X0:h/P,X1:(h+0.5)/P,lane:-(TRACK_HW+0.2)/LANE_W,stallLane:-(TRACK_HW+0.27)/LANE_W,exitLane:-1.6};}

function lapOf(c){return clamp(Math.floor(c.dist)+1,1,race.track.laps);}
function lapsDown(c,lead){lead=lead||race.order.find(x=>!x.dnf);return lead?Math.max(0,Math.floor(lead.dist-c.dist+1e-6)):0;}

/* Window for the next stop: the last lap you can still reach pit entry on fuel, and the first lap from which one more
   full tank gets you to the checkered flag. */

function stopTime(c,svc,exp){

 if(c.isMe)d-=(r.pitBonus||0)+relicSum('pit');

function enterPit(c,svc){

 if(r.phase==='caution'){c.cpit=r.caution.id;if(r.caution.stage==='closed')c.penal=r.caution.id;}
 if(c.isMe){r.pitReq=null;commentate(`You're coming down pit road for ${PIT.svcN[svc].toLowerCase()}.`);if(r.sel){r.sel=null;r.sel2=null;}}
 else if(idx(c)<3&&r.phase==='green')commentate(`${c.ref.name} hits pit road from P${idx(c)+1}.`,true);

function servicePit(c){

 if(svc==='two')c.tires=Math.min(100,c.tires*0.35+62);
 if(svc==='four'){c.tires=100;c.damage=Math.max(0,c.damage-12);}

 if(c.isMe){r.pitBonus=0;const t=(p.until-p.t1).toFixed(1);commentate(c.pitSlip?`Slow stop: ${t} s. A wheel hung up.`:`${t} s stop. ${PIT.svcN[svc]}${svc==='fuel'?'':' and fuel'}. Go go go!`);myPlans();}

/* What a car does when it reaches pit entry. */
function pitCall(c){
 const r=race,toGo=r.track.laps-c.dist,lap=lapOf(c),dry=c.fuel<1.02*c.burn;
 if(toGo<0.5)return null;
 if(r.phase==='caution'){
  const k=r.caution;if(c.cpass===k.id)return null;
  if(k.stage!=='open'){if(dry){c.cpass=k.id;return 'fuel';}return null;}
  c.cpass=k.id;const ch=c.isMe?k.mine:k.plans.get(c);

  return ch&&ch!=='stay'?ch:null;

 if(r.phase!=='green')return null;
 if(c.isMe){
  if(r.pitReq)return r.pitReq;

  return null;
 }
 if(c.planLap&&lap>=c.planLap)return c.planSvc||'four';

/* Speed on pit road: brake to the limit through the entry, stop in the stall, accelerate out through the exit. */
function pitV(c,v,base){

 if(p.stage==='in'){
  if(s<g.E1)return Math.min(v,base*(1-(1-PIT.limit)*clamp((s-g.E0)/(g.E1-g.E0),0,1)));
  const rem=c.stall-s;

/* Lateral path through pit road (visual). */
function pitLane(c){

 if(!p)return null;

/* Under caution and restarts each car closes up on whatever is physically ahead of it on track (the pace car, or the

function physAhead(){

 const f=x=>((x.dist%1)+1)%1;S.sort((a,b)=>f(a)-f(b));const m=new Map();

/* ---- caution flow ---- */
/* Pitting under yellow is worth it when it saves a stop later, or the tires are going away. */
function stopsLeft(fuel,toGo){return Math.max(0,Math.ceil((toGo+0.15-fuel)/fuelRange()));}

 if(needFuel){if(BAL.pitAuto===2)return 'four';return Math.random()<crewSkill()?(c.tires>=62?'two':'four'):'four';}

/* Q40: what a real crew chief calls. Stay out on good tires, fuel only when the tires are fine but the tank isn't, tires only when they're worn. */
function chiefCall(c,toGo,needFuel){

 if(needFuel){if(c.tires>=75||toGo<4)return 'fuel';return c.tires>=50?'two':'four';}

function aiCautionCall(c){

function cautionInit(reason){

 for(const c of r.cars){c.overtake=null;if(!c.dnf&&!c.isMe)r.caution.plans.set(c,aiCautionCall(c));}

function cautionTick(dt){

function oneToGo(){

 const rest=down.filter(x=>x!==dog&&!waves.includes(x));

/* ================= motion (visual only) =================

   where they are going, follow a racing line, tuck into the draft, never overlap, and bump with weight.
   Nothing here changes dist, order, pace or damage. */

/* The card face. Top: family tile + what it costs. Middle: odds, outcome bar, odds changers. Bottom: name, what it does, what it sets up. */
function cardFace(cd,h){
 const tc=cd.cost.tire?Math.round(cd.cost.tire*BAL.tireCost):0;
 const cx=(tc?`<b title="${BAL.refund>=1?`Uses ${tc}% tire only if it misses`:`Uses ${tc}% tire${BAL.refund?`, ${Math.round(tc*(1-BAL.refund))}% if it succeeds`:''}`}">${ic('tire')}${tc}%</b>`:'')+(cd.cost.mom?`<b title="Costs ${cd.cost.mom} Momentum">${ic('mom')}${cd.cost.mom}</b>`:'')+(HEAT_FAMS(cd)?`<b class="ht" title="Builds 1 Heat when played">${ic('heat')}+1</b>`:'');
 const ef=(CARD_FX[cd.id]||[]).map(([k,v])=>`<b title="${esc(FX_NAME[k]||'')}">${ic(k)}${esc(v)}</b>`).join('');
 const tk=BAL.tossFx&&cd.toss?TOSS_IC[cd.toss.k]:null;
 const lk=BAL.chainDraw&&LINK[cd.fam]?`<span class="lk" title="Sets up: ${LINK[cd.fam].map(f=>FAM[f].n).join(', ')}">▸ ${LINK[cd.fam].slice(0,3).map(f=>`<span style="color:${FAM[f].c}">${ic(f)}</span>`).join('')}</span>`:'';
 return `<kbd></kbd><span class="burn" role="button" title="${BAL.tossFx&&cd.toss?esc('Toss: '+tossTxt(cd)+' Also charges the Crew Board.'):BAL.board?'Toss: charges the crew board':'Discard: next card comes 10 s sooner'}">✕${tk?ic(tk):' toss'}</span>`+
  `<span class="ct"><span class="fi" title="${FAM[cd.fam].n}">${ic(cd.fam)}</span><span class="cx">${cx}</span></span><span class="pc"></span><span class="obr"><i class="ob"></i><span class="wx"></span></span><span class="mods"></span>`+
  `<span class="nm">${esc(cd.n)}</span>${ef?`<span class="ef">${ef}</span>`:''}${lk}${h.follow?'<span class="fu">FOLLOW-UP</span>':''}`;
}
/* Odds-changer chips: the biggest three temporary things moving this card's odds (combo, boosts, Setups, tune, Momentum, Heat...). */
function modChips(o){const m=o.mods||{};return Object.keys(m).filter(k=>Math.abs(m[k])>=1).sort((a,b)=>Math.abs(m[b])-Math.abs(m[a])).slice(0,3)
 .map(k=>`<b class="m-${k}" title="${MOD_INFO[k]} ${m[k]>0?'+':''}${m[k]}">${ic(k)}${G.showOdds?(m[k]>0?'+':'−')+Math.abs(m[k]):''}</b>`).join('');}
function modNet(o){let s=0;for(const k in (o.mods||{}))if(k!=='combo')s+=o.mods[k];return s;}
function tagIc(k){return k?ic(k):'';}

function updateHand(){

 const items=r.hand.map(h=>{const cd=CARDS[h.id];const blk=cardBlock(cd,c);const o=computeOdds(h.id,c);return {h,cd,blk,o};});

  {const md=b.querySelector('.mods');if(md)md.innerHTML=it.blk?'':modChips(it.o);const net=it.blk?0:modNet(it.o);b.classList.toggle('mb',net>=5);b.classList.toggle('mp',net<=-5);}

  {const k=!it.blk&&!r.attempt?comboFor(it.cd):0;b.classList.toggle('combo',!!k);let cb=b.querySelector('.cb');if(k&&!cb){cb=document.createElement('span');cb.className='cb';b.appendChild(cb);}if(cb){if(k)cb.innerHTML=`${ic('combo')} COMBO ×${k+1}`;else cb.remove();}}
  let bf=b.querySelector('.bf');const bv=r.buffs.find(x=>!x.fam||x.fam===it.cd.fam);
  if(bv&&!bf){bf=document.createElement('span');bf.className='bf';b.appendChild(bf);}if(bf){if(bv)bf.textContent='+'+bv.v;else bf.remove();}
 });
 shownOrder.forEach((u,i)=>{const b=document.querySelector(`.hcard[data-uid="${u}"] kbd`);if(b)b.textContent=i<9?String(i+1):'';});

/* ---------- live odds gauges: pick a card, watch its odds move with the race, play it ---------- */
function clickCard(uid){
 if(!race)return;
 if(race.sel===uid){playCard(uid);return;}
 if(race.sel2===uid){race.sel2=race.sel;race.sel=uid;renderGauges(true);updateHand();return;}
 if(race.sel&&relicSum('gauge2'))race.sel2=race.sel;

}
const gArc=(a0,a1,r=80)=>{const P=a=>{const th=Math.PI*(1-a);return [100+r*Math.cos(th),100-r*Math.sin(th)];};const [x0,y0]=P(a0),[x1,y1]=P(a1);return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;};
function gaugeSkeleton(i){return `<div class="gauge" id="g${i}"><div class="gh"><span data-kw="${i?'monitor2':'odds'}">${i?'Monitor 2':'Live odds'}</span><b class="gst"></b></div><div class="gc"></div>
 <svg viewBox="0 0 200 112" aria-hidden="true"><path d="${gArc(0,1)}" stroke="rgba(255,255,255,.1)" stroke-width="16" fill="none"/>
 <g class="zones"><path d="${gArc(0,0.4)}" stroke="#e5484d" stroke-width="16" fill="none"/><path d="${gArc(0.4,0.7)}" stroke="#e9b52f" stroke-width="16" fill="none"/><path d="${gArc(0.7,1)}" stroke="#2fb36a" stroke-width="16" fill="none"/></g>
 <path class="band" d="" stroke="rgba(255,255,255,.85)" stroke-width="4" fill="none"/>
 <g class="needle"><line x1="100" y1="6" x2="100" y2="36" stroke="#0a0e18" stroke-width="9" stroke-linecap="round"/><line x1="100" y1="6" x2="100" y2="36" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>
 <text class="gv" x="100" y="90" text-anchor="middle"></text><text class="gs" x="100" y="110" text-anchor="middle"></text></svg>
 <div class="ob"></div><div class="gtr"><span class="gtrend"></span><span class="gwr"></span></div><div class="gtags"></div>${i?'':'<button class="gplay">Hold to play (Space)</button>'}</div>`;}
function attemptGauge(el,c){

 el.querySelector('.ob').innerHTML=show?['cs','s','n','f','cf'].map(k=>`<u class="${TIER_CLS[k]}" style="flex:${Math.max(0,o.p[k]*100).toFixed(1)}"></u>`).join(''):'';

function playGauge(){if(!race)return;if(race.sel){playCard(race.sel);return;}const t=$('#g0 .gc');const c=ctxFor(meCar());let best=null;for(const h of race.hand){if(cardBlock(CARDS[h.id],c))continue;const o=computeOdds(h.id,c);if(!best||o.succ>best.o.succ)best={h,o};}if(best)playCard(best.h.uid);}
function renderGauges(force){

  el.querySelector('.gs').textContent=blk?blk:G.showOdds?`success · range ${Math.round(lo*100)}–${Math.round(hi*100)}%`:(d>3?'getting better':d<-3?'getting worse':'holding steady');

  el.querySelector('.gwr').innerHTML=show&&o.wreck>=0.01?`<span class="dn">${Math.round(o.wreck*100)}% wreck</span>`:'';
  el.querySelector('.gtags').innerHTML=o.tags.slice(0,3).map(([v,l,k])=>`<span class="${v>0?'up':'dn'}">${k?tagIc(k):v>0?'▲ ':'▼ '}${esc(l)}${G.showOdds?' '+(v>0?'+':'')+v:''}</span>`).join(' · ');
  const b=el.querySelector('.gplay');if(b){b.disabled=!!blk;b.textContent=auto?'Hold: play best (Space)':'Hold to play (Space)';}
 });
}

/* ================= end of race / rewards ================= */
function endRace(){
 const r=race;const fo=r.finalOrder.map(c=>c);
 const m=fo.find(c=>c.isMe);const finish=fo.indexOf(m)+1;
 const res={info:r.sawOdds?'full':G.info,track:r.track.name,start:r.stats.start,finish,expected:r.expected,dnf:m.dnf,crits:r.stats.crits,succ:r.stats.succ,plays:r.stats.plays,bestPos:r.stats.bestPos,bestChain:r.stats.bestChain||0,objE:r.objE||r.expected,
  beatMate:fo.indexOf(m)<fo.indexOf(r.mate),beatRival:fo.indexOf(m)<fo.indexOf(r.rival),rival:r.rival.ref.name,order:fo.map(c=>({id:c.id,dnf:c.dnf}))};
 const diff=r.expected-finish;
 res.tier=m.dnf||finish>r.expected+3?'rough':finish===1||(finish<=3&&diff>=8)?'victory':diff>=4?'strong':'solid';
 const mul=DIFF[G.diff].purse*(1+INFO[res.info].bonus+STAKES[G.stakes].bonus);res.mul=mul;
 res.purse=Math.round((1500+(21-finish)*350)*mul);res.bonus=Math.round(Math.max(0,diff)*400*mul);
 res.objs=normObjs(r.objectives).map(x=>{const o=objOf(x.id);return {id:x.id,n:objName(o,res.objE),ask:!!x.ask,pay:r100(o.pay*(x.ask?ASK_MUL:1)*mul),ok:!!o.test(res)};});
 // step 17: meet every objective (and finish) and the rewards move up one tier
 res.objMet=res.objs.filter(o=>o.ok).length;
 if(res.objs.length>=2&&res.objMet===res.objs.length&&!m.dnf&&res.tier!=='victory'){res.tierFrom=res.tier;res.tier={rough:'solid',solid:'strong',strong:'victory'}[res.tier];}
 if(G.sponsor&&sponsorOf(G.sponsor.id)){res.sponsor=G.sponsor.id;res.retainer=G.sponsor.per;}
 // step 18: team salary from contract talk, Hype and XP for the driver sheet
 res.tid=r.track.id;res.dmg=Math.round(m.damage||0);
 if(G.contract&&G.contract.per)res.salary=G.contract.per;
 if(G.drv){const hy=raceHype(res);res.hype=Math.min(hy.length,3-G.drv.hype);res.hypeWhy=hy;G.drv.hype+=res.hype;res.xp=DXP.race;res.lvlUp=addXp(DXP.race);}
 if(typeof crewEndRace==='function')crewEndRace(res,r); // step 19: crew XP and wages
 res.log=r.log;
 res.total=res.purse+res.bonus+(res.retainer||0)+(res.salary||0)-(res.wages||0)+res.objs.filter(o=>o.ok).reduce((s,o)=>s+o.pay,0);
 G.money+=res.total;G.results.push(res);
 stakesPenalty(res,m.dnf);
 scoreRace(res,fo);G.inRace=null;G.notice=null;
 fo.forEach((c,i)=>{c.ref.career.starts++;if(i===0){c.ref.career.wins++;c.ref.career.swins=(c.ref.career.swins||0)+1;}if(i<5)c.ref.career.top5++;c.ref.career.best=Math.min(c.ref.career.best,i+1);});
 // the AI field grows a little between races
 for(const c of G.cars)if(!c.isMe&&Math.random()<0.3){const k=pick(['power','handling','racecraft','defense']);c.stats[k]=clamp(c.stats[k]+1,1,10);}
 G.reward={res,cardOffer:rollCards(res.tier),cardRerolls:0,picked:false,relicOffer:(res.tier==='strong'||res.tier==='victory')?rollRelics(2):null,relicRerolls:0,relicPicked:false};
 race=null;showReward();
}
// stakes: what a DNF costs
function stakesPenalty(res,dnf){
 res.penalty=null;
 if(dnf&&G.stakes!=='standard'){
  if(G.stakes==='permadeath'&&G.survive>0){G.survive--;res.penalty='survive';}
  else if(G.stakes==='permadeath')res.penalty='dead';
  if(res.penalty!=='dead'){G.money=Math.max(0,G.money-3000);const spare=G.relics.filter(id=>!Object.values(G.equipped).includes(id));const lost=spare.length?pick(spare):null;if(lost)G.relics.splice(G.relics.indexOf(lost),1);res.lostPart=lost;res.penalty=res.penalty||'ironman';}
 }
}
function rollCards(tier){
 const a=ARCH[G.arch];const pool=Object.values(CARDS).filter(cd=>cd.rar!=='special').map(cd=>({id:cd.id,w:(cd.rar==='common'?6:cd.rar==='uncommon'?3:1.2)*((a.add.includes(cd.id))?1.8:1)*(tier==='victory'&&cd.rar!=='common'?2:1)*(tier==='rough'&&cd.rar==='rare'?0.2:1)}));
 const n=tier==='rough'?2:3;const out=[];let guard=0;while(out.length<n&&guard++<100){const p=wpick(pool).id;if(!out.includes(p))out.push(p);}
 if((tier==='strong'||tier==='victory')&&!out.some(id=>CARDS[id].rar!=='common')){const rs=Object.values(CARDS).filter(c=>c.rar!=='common'&&!out.includes(c.id));out[0]=pick(rs).id;}
 return out;
}

 return fit>0.15?['good','Good fit here']:fit<-0.15?['bad','Poor fit here']:['ok','Fine here'];}

function deckDiff(was,now,t){const add=[],out=[];const a={},b={};for(const id of was)a[id]=(a[id]||0)+1;for(const id of now)b[id]=(b[id]||0)+1;
 for(const id in b)for(let k=a[id]||0;k<b[id];k++)add.push(CARDS[id].n);for(const id in a)for(let k=b[id]||0;k<a[id];k++)out.push(CARDS[id].n);
 if(!add.length&&!out.length)return null;return `Your race deck broke a ${t.short} rule, so the crew fixed it${add.length?`: added ${add.join(', ')}`:''}${out.length?`${add.length?';':':'} took out ${out.join(', ')}`:''}. Change it in the deck builder.`;}

/* Garage cards: the same face as a card in your hand (cardFace), with the full effect text and your counts.
   The big number is the card's base chance before the race moves it (track, gap, tires...), or your own success rate once you've played it 3+ times. */
const BASE_ODDS={};
function baseOdds(id){if(id in BASE_ODDS)return BASE_ODDS[id];let v=null;
 const stub={gapA:0.5,gapB:0.5,seg:{},track:TRACKS[0],car:{tires:80,damage:0},pos:10,lap:3,laps:20};
 try{CARDS[id].read&&CARDS[id].read(stub,{b:x=>{throw {base:x};},a:()=>{}});}catch(e){if(e&&e.base!=null)v=e.base;}
 return BASE_ODDS[id]=v;}
function deckCard(id,o={}){const cd=CARDS[id],h=G.hist[id],mine=h&&h.plays>=3?Math.round(h.succ/h.plays*100):null,base=baseOdds(id);
 const big=mine!=null?mine:base;const cls=big==null?'na':big>=60?'hi':big>=40?'md':'lo';
 const tags=[cd.wreck?`<b class="dt-w" title="A critical failure can wreck you">${ic('wreck')}Can wreck</b>`:'',cd.noFail?'<b class="dt-s">Never fails</b>':'',`<b class="dt-r r-${cd.rar}">${cd.rar}</b>`].join('');
 const toss=BAL.tossFx&&cd.toss?`<p class="dtoss">${ic(TOSS_IC[cd.toss.k])}<span><b>Toss:</b> ${esc(tossTxt(cd))}</span></p>`:'';
 const act=o.mode==='build'?`<span class="dact"><button class="dbtn" data-out="${id}" ${o.inD?'':'disabled'} title="Take one out of the race deck">−</button><span class="dcount">${o.inD} / ${o.own}</span><button class="dbtn" data-in="${id}" ${o.why?`disabled title="${esc(o.why)}"`:'title="Put one in the race deck"'}>+</button></span>`:'';
 return `<div class="hcard dcard${o.inD?' in':''}${o.dim?' dim':''}" data-card="${id}" style="--fc:${FAM[cd.fam].c}">${cardFace(cd,{})}
  ${o.own>1&&o.mode!=='build'?`<span class="downed">×${o.own}</span>`:''}${o.mode==='build'&&o.inD?`<span class="dind">${ic('draw')}In deck ×${o.inD}</span>`:''}
  <p class="dtxt">${esc(cd.txt)}</p>${toss}<div class="dtags">${tags}</div>${act}</div>`
  .replace('<span class="pc"></span>',`<span class="pc ${cls}" title="${mine!=null?`Your success rate over ${h.plays} plays`:'Base chance before the race moves it'}">${big==null?'—':big+'%'}<small>${mine!=null?'yours':'base'}</small></span>`);}
function cardGrid(ids,f){return `<div class="dgrid">${ids.map(f).join('')}</div>`;}
// one card per id in a deck or collection, with counts, sorted by family then name
function groupIds(arr){const n={};for(const id of arr)n[id]=(n[id]||0)+1;return Object.keys(n).sort((a,b)=>FAM_ORDER.indexOf(CARDS[a].fam)-FAM_ORDER.indexOf(CARDS[b].fam)||CARDS[a].n.localeCompare(CARDS[b].n)).map(id=>[id,n[id]]);}
function deckCards(arr){return cardGrid(groupIds(arr),([id,n])=>deckCard(id,{own:n}));}

/* ================= character sheets ================= */
let sheetTab='car';
function openSheet(carId){
 const car=G.cars[carId];if(race&&!race.paused){race.paused=true;race._autoPaused=true;$('#pause').hidden=false;}
 $('#modal').hidden=false;renderSheet(car);
}
function closeSheet(){$('#modal').hidden=true;if(race&&race._autoPaused){race.paused=false;race._autoPaused=false;$('#pause').hidden=true;}if(screen==='garage')showGarage();if(screen==='event')renderEvent();}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet();});
function statRow(k,v){return `<div class="stat"><span>${STAT_INFO[k][0]}</span><div class="sb"><i style="width:${v*10}%"></i></div><span class="sv">${v}</span><small>${esc(STAT_INFO[k][1])}</small></div>`;}
function renderSheet(car){
 const t=TEAMS[car.team];const box=$('#mbox');const live=race&&race.cars.find(c=>c.id===car.id);
 const head=`<div class="row" style="justify-content:space-between"><div class="row"><span style="width:12px;height:44px;background:${t.c};border-radius:2px;display:inline-block"></span><div class="grid" style="gap:2px"><span class="eyebrow">#${car.num} · ${esc(t.name)}</span><h2>${esc(car.name)}${car.isMe?' (you)':''}</h2></div></div><button class="btn" id="s-close">Close (Esc)</button></div>`;
 const career=`<span class="muted" style="font-size:13px">Starts ${car.career.starts} · wins ${car.career.wins} · top 5s ${car.career.top5}${live?` · this race: P${idx(live)+1}, tires ${Math.round(live.tires)}%, damage ${Math.round(live.damage)}, passes ${live.passes}`:''}</span>`;
 if(!car.isMe){
  box.innerHTML=`${head}${career}<div class="grid g2"><div class="panel grid" style="gap:10px"><h3>Driver</h3>${['racecraft','defense','consistency','tireMgmt'].map(k=>statRow(k,car.stats[k])).join('')}</div><div class="panel grid" style="gap:10px"><h3>Car</h3>${['power','handling','aero','durability'].map(k=>statRow(k,car.stats[k])).join('')}</div></div>
  <div class="grid g2"><div class="panel grid" style="gap:6px"><h3>Ability</h3><b>${esc(TRAITS[car.trait].n)}</b><p class="muted">${esc(TRAITS[car.trait].txt)}</p></div><div class="panel grid" style="gap:6px"><h3>Equipment</h3>${car.gear.map(id=>`<div class="slot full"><span class="sn">${RELICS[id].slot}</span><b>${RELICS[id].n}</b></div>`).join('')}<p class="muted" style="font-size:12px">AI equipment is shown for flavor in this slice.</p></div></div>`;
  $('#s-close').onclick=closeSheet;return;
 }
 const canEquip=!race;
 const tabs=[['car','Car & driver'],['driver','Driver sheet'],['gear','Equipment'],['deck','Race deck']];
 let body='';
 if(sheetTab==='car')body=`<div class="grid g2"><div class="panel grid" style="gap:10px"><h3>Driver</h3>${['racecraft','defense','consistency','tireMgmt'].map(k=>statRow(k,G.stats[k])).join('')}</div><div class="panel grid" style="gap:10px"><h3>Car</h3>${['power','handling','aero','durability'].map(k=>statRow(k,G.stats[k])).join('')}</div><div class="panel grid" style="gap:10px"><h3>Crew</h3>${['crewChief','engineer','spotter','pitCrew'].map(k=>statRow(k,G.stats[k])).join('')}</div><div class="panel grid" style="gap:6px"><h3>Persona</h3><b>${esc(ARCH[G.arch].n)}</b><p class="muted">${esc(ARCH[G.arch].desc)}</p><p class="muted" style="font-size:13px">Upgrade stats in the garage shop between races.</p></div></div>`;
 if(sheetTab==='driver')body=driverTabHTML();
 if(sheetTab==='gear'){const inv=G.relics.filter(id=>!Object.values(G.equipped).includes(id));
  body=`<p class="muted" style="font-size:13px">${canEquip?'Click an equipped part to remove it, or a part in your inventory to install it in its slot.':'Parts can only be swapped in the garage.'}</p><div class="grid g4">${SLOTS.map(s=>{const id=G.equipped[s];return id?`<button class="slot full" data-unequip="${s}" ${canEquip?'':'disabled'}><span class="sn">${s}</span><b>${RELICS[id].n}</b><p>${esc(RELICS[id].txt)}</p></button>`:`<div class="slot"><span class="sn">${s}</span><p class="muted">Empty slot</p></div>`;}).join('')}</div>
  <h3>Inventory</h3>${inv.length?`<div class="grid g4">${inv.map(id=>`<button class="slot full" data-equip="${id}" ${canEquip?'':'disabled'}><span class="sn">${RELICS[id].slot}</span><b>${RELICS[id].n}</b><p>${esc(RELICS[id].txt)}</p></button>`).join('')}</div>`:'<p class="muted">Nothing in storage. Earn parts with strong runs or buy them from the parts dealer.</p>'}`;}
 if(sheetTab==='deck'){const rest=[...G.coll];for(const id of G.deck)rest.splice(rest.indexOf(id),1);
  body=`<p class="muted" style="font-size:13px">${G.deck.length} cards in your race deck. Change it in the garage deck builder.</p>${deckCards(G.deck)}${rest.length?`<h3>Rest of your collection (${rest.length})</h3>${deckCards(rest)}`:''}`;}
 box.innerHTML=`${head}${career}<div class="tabs">${tabs.map(([k,n])=>`<button class="chip${sheetTab===k?' on':''}" data-tab="${k}">${n}</button>`).join('')}</div>${body}`;
 box.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{sheetTab=b.dataset.tab;renderSheet(car);});
 if(sheetTab==='driver')wireDriverTab(box,car);
 box.querySelectorAll('[data-unequip]').forEach(b=>b.onclick=()=>{G.equipped[b.dataset.unequip]=null;renderSheet(car);});
 box.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{G.equipped[RELICS[b.dataset.equip].slot]=b.dataset.equip;renderSheet(car);});
 $('#s-close').onclick=closeSheet;
}

/* ================= controls ================= */
function togglePause(){if(!race)return;race.paused=!race.paused;race._autoPaused=false;race._beatPaused=false;$('#pause').innerHTML='Paused<small>Pick cards and watch their odds. P resumes.</small>';$('#pause').hidden=!race.paused;$('#b-pause').classList.toggle('on',race.paused);}
$('#b-pause').onclick=togglePause;
$('#b-speed').onclick=()=>{if(!race)return;race.speed={0.5:1,1:2,2:4,4:0.5}[race.speed];$('#b-speed').textContent=race.speed+'×';};
const CAMS=['auto','follow','wide'];
$('#b-look').onclick=()=>{setLook(LOOK_ORDER[(LOOK_ORDER.indexOf(LOOK)+1)%LOOK_ORDER.length]);toast('Look: '+LOOKS[LOOK].n,LOOKS[LOOK].d,'#121a2c');};
$('#b-cam').onclick=()=>{if(!race)return;race.cam=CAMS[(CAMS.indexOf(race.cam)+1)%3];$('#b-cam').textContent='Cam: '+race.cam[0].toUpperCase()+race.cam.slice(1);};
$('#b-odds').onclick=()=>{G.showOdds=!G.showOdds;if(G.showOdds&&race&&G.info!=='full'&&!race.sawOdds){race.sawOdds=true;toast('Odds on','This race no longer earns the '+INFO[G.info].n+' purse bonus','#5b6476');}$('#b-odds').classList.toggle('on',G.showOdds);updateHand();renderGauges();};
$('#b-sheet').onclick=()=>openSheet(me().id);
document.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT')return;
 if(!$('#modal').hidden){if(e.key==='Escape'){closeSheet();e.preventDefault();}return;}
 if(screen!=='race'||!race)return;
 if(TUT&&tutKey(e))return;
 if(e.key===' '){togglePause();e.preventDefault();}
 else if(e.key==='Escape'&&race.sel){race.sel=null;race.sel2=null;renderGauges(true);updateHand();}
 else if(e.key>='1'&&e.key<='9'){const u=shownOrder[+e.key-1];if(u)clickCard(u);}
 else if(e.key==='p'||e.key==='P'){togglePause();e.preventDefault();}
 else if(e.key==='a'||e.key==='A')acceptRadio();
 else if(e.key==='b'||e.key==='B')pitButton();
 else if(e.key==='x'||e.key==='X')ignoreRadio();
 else if(e.key==='c'||e.key==='C')$('#b-cam').click();
 else if(e.key==='o'||e.key==='O')$('#b-odds').click();
 else if(e.key==='l'||e.key==='L')$('#b-look').click();
 else if(e.key==='Tab'){openSheet(me().id);e.preventDefault();}
});

/* ================= main loop ================= */
function slowFactor(raw){
 const r=race;if(!r.sel||r.attempt||r.phase==='finished'||BAL.slowmo>=1)return 1;
 if(r.hazard&&r.sel===r.hazard.uid)return BAL.slowmo;
 if(!BAL.focusSec)return BAL.slowmo;
 if(r.focusMeter<=0)return 1;
 r.focusMeter=Math.max(0,r.focusMeter-raw/BAL.focusSec);return BAL.slowmo;
}
let last=performance.now();
function frame(now){
 const raw=Math.min(0.05,(now-last)/1000);last=now;
 if(race&&screen==='race'){
  if(!race.paused&&!(TUT&&TUT.hold)&&!(race.pg2&&race.pg2.phase==='plan')){const dt=raw*race.speed*slowFactor(raw)*cautionWarp();const n=Math.ceil(dt/0.02);for(let i=0;i<n&&race;i++)update(dt/n);}
  if(race){render(raw);uiTick(raw);}
  if(TUT)tutTick();
 }
 requestAnimationFrame(frame);
}

const K=(t,k)=>`<span class="kw" data-kw="${k}">${t}</span>`;
function kwShow(el){const g=GLOSS[el.dataset.kw];if(!g)return;const t=$('#kwtip');t.innerHTML=`<b>${g[0]}</b>${g[1]}`;t.hidden=false;
 const r=el.getBoundingClientRect();const w=t.offsetWidth,h=t.offsetHeight;let y=r.top-h-8;if(y<6)y=r.bottom+8;
 t.style.left=clamp(r.left+r.width/2-w/2,6,innerWidth-w-6)+'px';t.style.top=Math.min(y,innerHeight-h-6)+'px';t._el=el;}
function kwHide(){$('#kwtip').hidden=true;$('#kwtip')._el=null;}
document.addEventListener('mousemove',e=>{const el=e.target.closest&&e.target.closest('[data-kw]');if(el){if($('#kwtip')._el!==el)kwShow(el);}else if(!$('#kwtip').hidden)kwHide();});
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('.kw');if(el&&!matchMedia('(hover:hover)').matches){kwShow(el);clearTimeout(kwHide._t);kwHide._t=setTimeout(kwHide,3500);}});

 const sel=r.sel&&r.hand.find(h=>h.uid===r.sel);if(sel&&!cardBlock(CARDS[sel.id],c))return sel.uid;
 let best=null;for(const h of r.hand){if(cardBlock(CARDS[h.id],c))continue;const o=computeOdds(h.id,c);if(!best||o.succ>best.o.succ)best={h,o};}
 return best?best.h.uid:null;
}
function aimStart(src){

/* ===== Pit stop mini-game + stacking Setups (roadmap 6b) =====
   When your car stops in its stall the race holds while you plan the stop: you draw a pit hand from your pit deck
   (plus Prep from leftover Crew Board charges) and put cards into three crew lanes that work at the same time:
   tires, fuel and adjustments. The stop lasts as long as the slowest lane. Then the jack drops and you tap RELEASE:
   early risks a loose wheel, late gives time away. Adjustment cards install Setups: up to 3 ongoing bonuses that
   level up when you install the same one again, combine into Packages, and go stale over a long run without a stop. */
const PG={planSec:12,hand:5,prepMax:3,adjT:4,fixT:4,maxAdj:3,staleK:1,early:1,looseK:0.6,looseT:3,lateAuto:0.8};
const PIT_CARDS={
 quick_jack:{n:'Quick Jack',lane:'tire',base:62,d:{cs:-1.5,s:-1,n:0,f:1.5},txt:'Tires −1 s',miss:'miss +1.5 s'},

 lug_gamble:{n:'Four-Lug Gamble',lane:'tire',base:45,d:{cs:-2.5,s:-2,n:0,f:2.5},txt:'Tires −2 s',miss:'miss +2.5 s'},
 fast_fill:{n:'Fast Fill',lane:'fuel',base:62,d:{cs:-1.5,s:-1,n:0,f:1.5},txt:'Fuel −1 s',miss:'miss +1.5 s'},
 catch_can:{n:'Catch Can Pro',lane:'fuel',base:80,safe:1,d:{cs:-0.8,s:-0.5,n:-0.2},txt:'Fuel −0.5 s',miss:'never slower'},
 utility:{n:'Utility Man',lane:'any',base:70,d:{cs:-1.2,s:-0.8,n:0,f:1},txt:'Slowest lane −0.8 s',miss:'miss +1 s'},
 fix:{n:'Fix the Damage',lane:'adj',time:PG.fixT,fix:20,txt:'+4 s · fixes 20, worst spot first'},
 adj_wedge:{n:'Round of Wedge',lane:'adj',setup:'wedge'},
 adj_trackbar:{n:'Track Bar Up',lane:'adj',setup:'trackbar'},
 adj_air:{n:'Air Pressure',lane:'adj',setup:'air'},
 adj_spring:{n:'Spring Rubber',lane:'adj',setup:'spring'},
 adj_tape:{n:'Tape the Grille',lane:'adj',setup:'tape'}
};
const PIT_DECK0=['quick_jack','quick_jack','air_gun','air_gun','lug_gamble','fast_fill','catch_can','utility','fix','adj_wedge','adj_wedge','adj_trackbar','adj_air','adj_spring','adj_spring','adj_tape'];

 wedge:{n:'Round of Wedge',s:'Wedge',fam:'draft',v:[6,12],txt:l=>`Drafting cards +${[6,12][l-1]}, drawn more`},
 spring:{n:'Spring Rubber',s:'Springs',fam:'pass',v:[5,10],txt:l=>`Passing cards +${[5,10][l-1]}, drawn more`},

 air:{n:'Air Pressure',s:'Air',wear:[0.85,0.72],txt:l=>`Tire wear −${[15,28][l-1]}%`}
};

 {id:'longrun',n:'Long-Run Package',of:['wedge','air'],wear:0.88,b:{draft:4},txt:'Tire wear −12% more, Drafting +4'},
 {id:'restart',n:'Restart Package',of:['trackbar','spring'],b:{restart:10,defend:4},txt:'Restart cards +10, Defending +4'},

];
const LANE_N={tire:'Tires',fuel:'Fuel',adj:'Adjust'};
function pgOn(){return !!race&&!BAL.noPitGame;}
function pgPkgs(){const r=race,h=new Set((r.setups||[]).map(s=>s.id));return PACKAGES.filter(p=>p.of.every(x=>h.has(x)));}
function setupReads(cd){
 const r=race,out=[];if(!r||!r.setups)return out;
 for(const s of r.setups){const d=SETUPS[s.id];if(d.fam===cd.fam)out.push([d.v[s.lvl-1],`${d.s} ${s.lvl>1?'II':'I'}`]);}
 for(const p of pgPkgs())if(p.b&&p.b[cd.fam])out.push([p.b[cd.fam],p.n]);
 return out;
}
function setupWear(){const r=race;if(!r||!r.setups)return 1;let m=1;for(const s of r.setups){const d=SETUPS[s.id];if(d.wear)m*=d.wear[s.lvl-1];}for(const p of pgPkgs())if(p.wear)m*=p.wear;return m;}
function pcOdds(id){const d=PIT_CARDS[id];if(!d.base)return null;const s=clamp((d.base+((G.stats.pitCrew||G.stats.crewChief)-5)*4+(typeof crewLaneOdds==='function'?crewLaneOdds(d.lane):0))/100,0.15,0.95);
 return d.safe?{cs:s*0.2,s:s*0.8,n:1-s,f:0}:{cs:s*0.2,s:s*0.8,n:(1-s)*0.45,f:(1-s)*0.55};}
function pcExp(id){const o=pcOdds(id),d=PIT_CARDS[id].d;let e=0;for(const k in o)e+=o[k]*(d[k]||0);return e;}
function pgBase(c,svc){const R=fuelRange(),m=1-(G.stats.crewChief-5)*0.03,b=(race.pitBonus||0)+relicSum('pit'),tt=PIT.tireT[svc]||0;
 return {tire:tt?Math.max(2.5,tt*m-b):0,fuel:Math.max(1,(PIT.fuelBase+PIT.fuelT*clamp(1-c.fuel/R,0,1))*m-b)};}
const LANE_MIN={tire:2.5,fuel:1};
/* Lane lengths: rolled deltas once the stop is running, expected deltas while you plan. */
function pgLanes(pg,useRoll){
 const L={tire:pg.base.tire,fuel:pg.base.fuel,adj:0},any=[];
 for(const pc of pg.hand){if(!pc.on)continue;const d=PIT_CARDS[pc.id];const dv=useRoll&&pc.roll?pc.delta:d.base?pcExp(pc.id):(d.time||PG.adjT);
  if(d.lane==='any')any.push(dv);else if(d.lane==='adj')L.adj+=d.base?0:dv;else if(L[d.lane]>0)L[d.lane]+=dv;}
 for(const dv of any){const k=L.tire>=L.fuel?'tire':'fuel';L[k]+=dv;}
 for(const k of ['tire','fuel'])if(pg.base[k]>0)L[k]=Math.max(LANE_MIN[k],L[k]);

function pgTotal(L){return Math.max(L.tire,L.fuel,L.adj);}
function pcUsable(pg,pc){const d=PIT_CARDS[pc.id];if(d.lane==='tire'&&!pg.base.tire)return 'No tires this stop';
 if(d.lane==='adj'&&!pc.on&&pg.hand.filter(x=>x.on&&PIT_CARDS[x.id].lane==='adj').length>=PG.maxAdj)return `Max ${PG.maxAdj} adjustments`;return null;}
/* Where a Setup card would go: a level-up, a new slot, or replacing your stalest Setup. */
function setupPlan(id,list){const s=(list||race.setups||[]).find(x=>x.id===id);if(s)return s.lvl>=2?{kind:'fresh'}:{kind:'up'};
 const L=list||race.setups||[];if(L.length<3)return {kind:'new'};const old=[...L].sort((a,b)=>a.lvl-b.lvl||a.at-b.at)[0];return {kind:'swap',old};}
/* Your Setups as they would be after this stop's selected cards (except one), for card labels and the preview. */

   your discard pile). Power, Aero, Handling and Racecraft set your base lap (carRating, like the AI); Handling and
   Consistency widen the Good zone; Racecraft widens Perfect. Skip = an average lap, the same odds as the old roll-off.
   The result is G.qual = {ri, grid:[car ids], card, time, pos, skip}; startRace reads it. Everything below the UI is
   pure and also runs headless (qualiAuto) so the harness can play it. */

const qcardOf=id=>id&&CARDS[id]?QCARD[CARDS[id].fam]:null;
// the corners of one lap, in order from the start/finish line, as track fractions (worldPos u)
function qualiCorners(t){
 if(!t.path){const P=perim(t),S=t.S,T=Math.PI*t.R,ss=t.id==='talon';
  return [{d:S,n:'Turn 1',a:ss?'Stay low':'Lift'},{d:S+T,n:'Turn 2',a:'Gas'},{d:2*S+T,n:'Turn 3',a:ss?'Stay low':'Lift'},{d:2*S+2*T,n:'Turn 4',a:'Gas'}].map(c=>({u:c.d/P,n:c.n,a:c.a,kind:'oval'}));}
 const g=TG(t),out=[];let prevT=false;
 for(const sg of g.segs){if(sg.k!=='t'){if(sg.len>0.05)prevT=false;continue;}if(prevT)continue;prevT=true;out.push({u:sg.brakeA/g.P,n:sg.nm,a:'Brake',kind:sg.kind});}

function qualiZones(stats,card,t){

 let wg=clamp(0.05+0.009*(stats.handling-3)+0.009*(stats.consistency-4),0.035,0.16),wp=clamp(0.015+0.005*(stats.racecraft-4),0.01,0.05);

}
// a run: every check with its zone, timing and lap
function qualiPlan(t,stats,card){
 const laps=QL.laps,cs=qualiCorners(t),z=qualiZones(stats,card,t),sweep=QL.sweep[t.id]||1.45,n=laps*cs.length;
 const gap=clamp(QL.runSec/n-sweep,0.75,QL.gapMax),u0=t.S!=null?(t.S/2)/perim(t):(TG(t).S/2)/TG(t).P;

 for(let l=0;l<laps;l++)for(const c of cs){let u=c.u+l;while(u<=uPrev)u+=1;
  const k=c.kind==='hairpin'?0.8:c.kind==='sweeper'?1.2:t.id==='talon'?1.25:1,w1=(card&&z.fam==='pit'&&l===0)?1.25:1;

// judge a release at needle x (null = never released = late)
function qualiJudge(ch,x){if(x==null)return 'L';const d=Math.abs(x-ch.c);return d<=ch.wp?'P':d<=ch.wg?'G':d<=ch.wo?'O':x<ch.c?'E':'L';}

function qualiScore(pl){

 for(const ch of pl.checks){if(!ch.res)break;let r=ch.res;
  if(fam==='defend'&&(r==='E'||r==='L')&&!missUsed[ch.lap]){missUsed[ch.lap]=1;r='O';ch.saved=1;}
  let p=QL.pts[r];
  if(r==='P'||r==='G'){p*=1+QL.chainStep*(chain-1);if(fam==='risk')p*=1.5;chain=Math.min(QL.chainMax,chain+1);}
  else if(r==='O'){}

// pace fraction (higher = faster) for my car from an average-points score
const qualiDelta=avg=>QL.skipQ+QL.K*(avg-QL.skipPts);

const qualiUp=s=>QL.statK*Math.max(0,['power','aero','handling','racecraft','consistency'].reduce((a,k)=>a+(s[k]-(k==='consistency'||k==='racecraft'?4:3)),0)-((G&&ARCH[G.arch]&&ARCH[G.arch].bonus)?Object.entries(ARCH[G.arch].bonus).filter(([k])=>['power','aero','handling','racecraft','consistency'].includes(k)).reduce((a,[,v])=>a+v,0):0));

const qBase=()=>carRating(me())+qualiUp(G.stats);
// the full grid: AI as before (carRating + noise), me from my run (or the old roll-off when skipped)
function qualiGrid(t,avg,skip){

function qualiFinish(t,pl,skip){

// three different cards from the race deck to pick from
function qualiOffer(){const ids=[...new Set(shuffle([...G.deck]))];return ids.slice(0,3);}
/* headless: play a run as a bot. prof: skip | poor | avg | good | great; card: null | 'best' | an id.

const QBOT={poor:0.07,avg:0.045,good:0.028,great:0.018};
function qualiAuto(prof,card){
 const t=TRACKS[G._pti!=null?G._pti:arcTi(G.raceIdx)];
 if(prof==='skip'||!QBOT[prof])return qualiFinish(t,null,true);
 if(card==='best'){const off=qualiOffer();let bv=-1e9;card=null;for(const id of off){const v=qualiAutoRun(t,prof,id,true);if(v>bv){bv=v;card=id;}}const v0=qualiAutoRun(t,prof,null,true);if(v0>=bv)card=null;}

function qualiAutoRun(t,prof,card,est){

 for(let r=0;r<reps;r++){pl=qualiPlan(t,G.stats,card);let focus=qcardOf(card)&&CARDS[card].fam==='crew'?1.5:1;
  for(const ch of pl.checks){let sg=QBOT[prof];const cost=0.6/QL.focusSec;if(focus>=cost){focus-=cost;sg*=0.5;}
   const x=ch.c+gauss()*sg;ch.x=x<0||x>1?null:x;ch.res=qualiJudge(ch,ch.x);if(ch.res==='P')focus+=QL.perfFocus;}

 {const u0=pl.checks[0].u0,[a,b]=qualiXY(u0);x.fillStyle='#f4f5f8';x.fillRect(a-2,b-7,4,14);}

 for(const c of pl.checks){if(c.lap!==cur.lap)continue;const [a,b]=qualiXY(c.u);x.beginPath();x.arc(a,b,c===cur&&!c.res?6:4.5,0,7);

 {const [a,b]=qualiXY(cur.u);x.font='bold 11px sans-serif';x.textAlign=a>W/2?'right':'left';x.textBaseline='middle';x.lineWidth=3;x.strokeStyle='#05070c';const lb=cur.n.toUpperCase(),lx=a+(a>W/2?-11:11);x.strokeText(lb,lx,b);x.fillStyle='#e9b52f';x.fillText(lb,lx,b);}
 // car

 // bar
 const inS=cur&&!cur.res&&T>=cur.s0,show=cur&&(inS||T>=cur.t0);
 const set=(id,l,w)=>{const e=document.getElementById(id);e.style.left=(l*100)+'%';e.style.width=(w*100)+'%';};
 if(cur){set('q-zo',cur.c-cur.wo,2*cur.wo);set('q-zg',cur.c-cur.wg,2*cur.wg);set('q-zp',cur.c-cur.wp,2*cur.wp);}
 const nd=$('#q-needle');const nx=inS?(T-cur.s0)/(cur.s1-cur.s0):cur&&cur.res&&cur.x!=null?cur.x:0;nd.style.left=(nx*100)+'%';
 $('#q-track').classList.toggle('live',!!inS);$('#q-track').classList.toggle('slow',!!slow);
 const j=$('#q-judge');if(QS.judge&&T-QS.judge.at>1.1&&j.textContent){j.textContent='';}

 const sc=qualiScore(pl);$('#q-time').textContent=sc.n?qualiLap(QS.t,qBase()+qualiDelta(sc.avg)).toFixed(3):'--.---';
 $('#q-chain').innerHTML=[1,2,3,4].map(i=>`<i class="${i<=sc.chain?'on':''}"></i>`).join('')+`<b class="mono">×${sc.chain}</b>`;

}
