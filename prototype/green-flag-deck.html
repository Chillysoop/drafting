<script id="driver-js">
/* ================= driver sheet + d20 checks (roadmap step 18) =================
   Off track is a tabletop check: d20 + attribute modifier + proficiency (if proficient) + labeled extras >= DC.
   Natural 20 = critical, natural 1 = fumble. Made it = success, missed by 1-4 = mixed (you get it, with a cost), 5+ = failure.
   Advantage/disadvantage roll two dice and keep the higher/lower; both at once cancel. Hype (earned on track) buys advantage or a reroll.
   Every option shows its modifiers by source, the DC, the roll needed and the five-tier odds before the roll,
   and the result shows "what would have helped" after it. The image map (Humble/Cocky x Professional/Showman) moves with the tone of each answer. */
const DATTR={presence:{n:'Presence',ab:'PRE',d:'Camera charm, star power'},wits:{n:'Wits',ab:'WIT',d:'Thinking on your feet'},composure:{n:'Composure',ab:'COM',d:'Handling pressure and criticism'},savvy:{n:'Savvy',ab:'SAV',d:'Business sense'},rapport:{n:'Rapport',ab:'RAP',d:'Relationships with people'},grit:{n:'Grit',ab:'GRT',d:'Fitness and work ethic'}};
const DSKILL={media:{n:'Media',a:'presence'},pitch:{n:'Sponsor Pitch',a:'presence'},read:{n:'Read the Room',a:'wits'},deflect:{n:'Deflect',a:'wits'},cool:{n:'Keep Cool',a:'composure'},negotiate:{n:'Negotiate',a:'savvy'},contract:{n:'Read Contract',a:'savvy'},crew:{n:'Lead the Crew',a:'rapport'},peace:{n:'Make Peace',a:'rapport'},endure:{n:'Endurance',a:'grit'},fans:{n:'Fan Work',a:'grit'}};
const DPROF=2,ATTR_MAX=20,amod=s=>Math.floor((s-10)/2),sgn=v=>(v>0?'+':v<0?'−':'+')+Math.abs(v);
const DXP={race:25,made:30,missed:20},xpNeed=l=>100*l;
// image map: x = Humble (-) .. Cocky (+), y = Professional (-) .. Showman (+). Each answer moves 1 step per axis; an image needs 2+ on both axes.
const IMAGES={
 rookie:{n:'Cocky Rookie',x:1,y:1,fav:['media','deflect'],c:'#ff6b5e',txt:'Big fan swings. Youth brands love you; veterans don\'t.'},
 champ:{n:'Humble Champion',x:-1,y:-1,fav:['cool','crew'],c:'#2fb3a0',txt:'Blue-chip sponsors and top teams trust you.'},
 fan:{n:'Fan Favorite',x:-1,y:1,fav:['fans','pitch'],c:'#f2c94c',txt:'Fans and grassroots sponsors. Media goes easy on you.'},
 assassin:{n:'Cold Assassin',x:1,y:-1,fav:['read','negotiate'],c:'#a99bff',txt:'Media is cold, the garage respects you, contracts are pure business.'}
};
const IMG_AT=2,IMG_LEAN=5,IMG_MAX=10;
const TONE_N={x:{'-1':'Humble','1':'Cocky'},y:{'-1':'Professional','1':'Showman'}};
function imageOf(p){p=p||(G&&G.drv&&G.drv.img);if(!p||Math.abs(p.x)<IMG_AT||Math.abs(p.y)<IMG_AT)return null;return Object.keys(IMAGES).find(k=>IMAGES[k].x===Math.sign(p.x)&&IMAGES[k].y===Math.sign(p.y))||null;}
function inChar(t,im){const I=IMAGES[im];return !!t&&(!t.x||Math.sign(t.x)===I.x)&&(!t.y||Math.sign(t.y)===I.y);}
const toneChips=t=>t?['x','y'].filter(a=>t[a]).map(a=>`<span class="tone">${TONE_N[a][Math.sign(t[a])]}</span>`).join(''):'';
const shortTrack=c=>!!c&&['mill','pine'].includes(c.tid);
// backgrounds: two proficiencies, a trait, a flaw and a starting spread (15 14 13 12 10 9)
const BACKGROUNDS={
 hero:{n:'Short-Track Hero',blurb:'Grew up winning Saturday nights at the local bullring.',attr:{presence:14,wits:12,composure:9,savvy:10,rapport:13,grit:15},prof:['media','endure'],
  trait:{n:'Hometown Favorite',txt:'Advantage on Media checks after a short-track race (Millbrook, Pinewood).',fx:(sk,c)=>sk==='media'&&shortTrack(c)?{adv:'Hometown Favorite: short-track crowd'}:null},
  flaw:{n:'Short Fuse',txt:'Disadvantage on Keep Cool after a DNF or a race you finished with heavy damage.',fx:(sk,c)=>sk==='cool'&&c&&(c.dnf||c.dmg>=40)?{dis:'Short Fuse: still hot from the race'}:null}},
 rich:{n:'Rich Kid',blurb:'Family money bought the first car. Now you have to prove it.',attr:{presence:15,wits:13,composure:12,savvy:14,rapport:10,grit:9},prof:['pitch','negotiate'],fans:20,
  trait:{n:'Old Money',txt:'+2 on Sponsor Pitch. You know how these dinners go.',fx:sk=>sk==='pitch'?{v:2,src:'Old Money (trait)'}:null},
  flaw:{n:'Silver Spoon',txt:'−1 on Media and Fan Work. Fans don\'t buy the story. Starts with fewer fans.',fx:sk=>sk==='media'||sk==='fans'?{v:-1,src:'Silver Spoon (flaw)'}:null}},
 dirt:{n:'Dirt Grinder',blurb:'Ran dirt ovals in a truck you fixed yourself.',attr:{presence:10,wits:12,composure:14,savvy:9,rapport:13,grit:15},prof:['endure','fans'],
  trait:{n:'Seen Worse',txt:'+2 on Keep Cool after a DNF.',fx:(sk,c)=>sk==='cool'&&c&&c.dnf?{v:2,src:'Seen Worse (trait)'}:null},
  flaw:{n:'Rough Edges',txt:'−1 on Sponsor Pitch and Negotiate.',fx:sk=>sk==='pitch'||sk==='negotiate'?{v:-1,src:'Rough Edges (flaw)'}:null}},
 crew:{n:'Former Crew Member',blurb:'Changed tires for six seasons before anyone let you drive.',attr:{presence:9,wits:14,composure:13,savvy:10,rapport:15,grit:12},prof:['crew','read'],
  trait:{n:'Shop Talk',txt:'Advantage on Lead the Crew checks.',fx:sk=>sk==='crew'?{adv:'Shop Talk: you speak their language'}:null},
  flaw:{n:'Camera Shy',txt:'−1 on Media.',fx:sk=>sk==='media'?{v:-1,src:'Camera Shy (flaw)'}:null}},
 sim:{n:'Sim Racer',blurb:'Ten thousand online races, three real ones.',attr:{presence:9,wits:15,composure:13,savvy:14,rapport:10,grit:12},prof:['read','deflect'],
  trait:{n:'Data Brain',txt:'+1 on Read the Room and Read Contract.',fx:sk=>sk==='read'||sk==='contract'?{v:1,src:'Data Brain (trait)'}:null},
  flaw:{n:'Keyboard Warrior',txt:'Disadvantage on Keep Cool at press scrums.',fx:(sk,c)=>sk==='cool'&&c&&c.ev==='press'?{dis:'Keyboard Warrior: the comments get to you'}:null}}
};
const BG_FOR={drafter:'sim',bully:'hero',whisperer:'dirt',restart:'crew',gambler:'rich'};
function newDriver(bg){if(!BACKGROUNDS[bg])bg='hero';const B=BACKGROUNDS[bg];return {bg,attr:Object.assign({},B.attr),prof:[...B.prof],lvl:1,xp:0,pts:0,hype:0,fans:B.fans||35,respect:35,img:{x:0,y:0},trail:[],log:[],next:{mom:0}};}
// saves from before step 18 get a driver from their persona's default background
function ensureDrv(){if(!G)return;if(!G.drv)G.drv=newDriver(BG_FOR[G.arch]||'hero');if(!G.contract)G.contract={per:0,clauses:[]};const d=G.drv;d.next=d.next||{mom:0};d.trail=d.trail||[];d.log=d.log||[];d.img=d.img||{x:0,y:0};}
function addXp(n){const d=G.drv,up=[];d.xp+=n;while(d.xp>=xpNeed(d.lvl)){d.xp-=xpNeed(d.lvl);d.lvl++;d.pts++;up.push(d.lvl);}return up;}
// Hype from the race: a x4 combo, and a big finish (top 3 or 5+ spots over expected). Max 3 held.
function raceHype(res){const why=[];if((res.bestChain||0)>=4)why.push('×4 combo');if(!res.dnf&&(res.finish<=3||res.expected-res.finish>=5))why.push(res.finish<=3?`P${res.finish} finish`:`${res.expected-res.finish} spots over expected`);return why;}

/* ---- the check ---- */
function chkTier(d,mod,dc){if(d===20)return 'crit';if(d===1)return 'fumble';const t=d+mod;return t>=dc?'succ':t>=dc-4?'mixed':'fail';}
function chkOdds(mod,dc,mode){const o={crit:0,succ:0,mixed:0,fail:0,fumble:0};for(let k=1;k<=20;k++){const p=mode==='adv'?(k*k-(k-1)*(k-1))/400:mode==='dis'?((21-k)**2-(20-k)**2)/400:1/20;o[chkTier(k,mod,dc)]+=p;}return o;}
const TIER_D={crit:['Critical','#fff','o-crit'],succ:['Success','var(--green)','o-succ'],mixed:['Mixed','var(--amber)','o-mixed'],fail:['Failure','var(--red)','o-fail'],fumble:['Fumble','#ff7b7f','o-fumble']};
const TIERS=['crit','succ','mixed','fail','fumble'];
const pct=p=>p>0&&p<0.005?'<1%':Math.round(p*100)+'%';
// every modifier on a check, labeled by source. L adds to the die, dcl moves the DC, adv/dis are the reasons for two dice.
function chkBuild(o,ev,hype){
 const d=G.drv,sk=DSKILL[o.skill],A=DATTR[sk.a],sc=d.attr[sk.a],B=BACKGROUNDS[d.bg],c=ev.ctx;
 const L=[{v:amod(sc),src:`${A.n} ${sc}`,k:'attr'}],adv=[],dis=[],dcl=[];
 if(d.prof.includes(o.skill))L.push({v:DPROF,src:'Proficiency',k:'prof'});
 const im=imageOf();
 if(im&&IMAGES[im].fav.includes(o.skill)&&inChar(o.tone,im))L.push({v:1,src:`${IMAGES[im].n}, in character`,k:'image'});
 if(o.sig&&im===o.sig&&Math.abs(d.img.x)>=IMG_LEAN&&Math.abs(d.img.y)>=IMG_LEAN)L.push({v:1,src:'Leaning all the way in',k:'image'});
 for(const t of [B.trait,B.flaw]){const f=t.fx(o.skill,c);if(!f)continue;if(f.v)L.push({v:f.v,src:f.src,k:'trait'});if(f.adv)adv.push(f.adv);if(f.dis)dis.push(f.dis);}
 const E=EVENTS[ev.id],s=E.sit?E.sit(o,ev)||{}:{};
 (s.L||[]).forEach(l=>L.push(Object.assign({k:'sit'},l)));(s.dcl||[]).forEach(l=>dcl.push(l));(s.adv||[]).forEach(a=>adv.push(a));(s.dis||[]).forEach(a=>dis.push(a));
 if(hype)adv.push('Spent 1 Hype');
 const mod=L.reduce((a,l)=>a+l.v,0),dc=o.dc+dcl.reduce((a,l)=>a+l.v,0);
 const mode=adv.length&&!dis.length?'adv':dis.length&&!adv.length?'dis':'flat';
 return {L,dcl,adv,dis,mod,dc,mode,odds:chkOdds(mod,dc,mode),need:clamp(dc-mod,2,20)};
}
const d20=()=>1+Math.floor(Math.random()*20);
function chkRoll(b){const a=d20(),z=d20();const kept=b.mode==='adv'?Math.max(a,z):b.mode==='dis'?Math.min(a,z):a;
 // the second die is rolled every time: with one die it is only shown afterwards, as what advantage would have done
 return {dice:[a,z],kept,other:kept===a?z:a,total:kept+b.mod,tier:chkTier(kept,b.mod,b.dc)};}
// "what would have helped": attribute, proficiency, image, advantage (the second die), Hype, and the other answers on the same die
function chkHelp(o,b,R,ev,opts){
 const d=G.drv,sk=DSKILL[o.skill],A=DATTR[sk.a],sc=d.attr[sk.a],out=[];
 if(R.tier==='crit')return [`Natural 20. Nothing could beat that.`];
 if(R.tier==='succ'){const m=R.total-b.dc;out.push(`Made it by ${m}. ${m>=4?'Plenty of room.':`One bad roll from a mixed result: every +1 on ${sk.n} is +5% here.`}`);
  if(b.mode==='flat'&&R.other===1)out.push('Your second die was a 1. Rolling with disadvantage would have fumbled.');return out;}
 if(R.tier==='fumble'){out.push('A natural 1 always fumbles, whatever the modifiers.');
  if(b.mode!=='adv')out.push(`With advantage you'd have kept your other die, a ${R.other}: ${TIER_D[chkTier(R.other,b.mod,b.dc)][0].toLowerCase()}. ${d.hype?'You have Hype to spend on advantage.':'Earn Hype on track with a ×4 combo or a big finish.'}`);
  return out;}
 const gap=b.dc-R.total,goal=R.tier==='mixed'?'a success':'a mixed result';
 const gapM=R.tier==='mixed'?gap:gap-4; // to reach mixed you only need to get within 4
 out.push(`Rolled ${R.kept} ${sgn(b.mod)} = ${R.total} vs DC ${b.dc}. Missed by ${gap}.`);
 let s=sc;while(s<ATTR_MAX&&amod(s)<amod(sc)+gapM)s++;
 if(amod(s)>=amod(sc)+gapM)out.push(`${A.n} ${sc} → ${s} (${sgn(amod(s))}) would have made it ${goal}.`);
 if(!d.prof.includes(o.skill)&&gapM<=DPROF)out.push(`Proficiency in ${sk.n} (+${DPROF}) would have made it ${goal}.`);
 const im=imageOf(),fav=Object.keys(IMAGES).find(k=>IMAGES[k].fav.includes(o.skill));
 if(gapM<=1&&fav&&!(im===fav&&inChar(o.tone,im)))out.push(`Answering in character as a ${IMAGES[fav].n} (+1) would have made it ${goal}.`);
 if(b.mode!=='adv'&&R.other>R.kept){const t2=chkTier(R.other,b.mod,b.dc);if(TIERS.indexOf(t2)<TIERS.indexOf(R.tier))out.push(`Advantage would have kept your other die, a ${R.other}: ${TIER_D[t2][0].toLowerCase()}. ${d.hype?'Spend Hype for advantage.':'Earn Hype on track with a ×4 combo or a big finish.'}`);}
 for(const x of opts){if(x===o||x.auto)continue;const b2=chkBuild(x,ev,false),t2=chkTier(R.kept,b2.mod,b2.dc);if(t2==='succ'||t2==='crit')out.push(`${x.n} (${DSKILL[x.skill].n}, needed ${b2.need}+) would have passed on this roll.`);}
 // always point at the best bet: the answer with the best odds this round, or the long-term fix if this was it
 const pass=bb=>bb.odds.crit+bb.odds.succ,mine=pass(b);let best=null;

 else out.push(`This was already your best answer here (${pct(mine)} to pass). Long term, every +1 on ${sk.n} adds 5%: raise ${A.n}${d.prof.includes(o.skill)?'':' or pick up the proficiency'}.`);

}

function fxScale(fx,k){const o={};for(const key in fx)o[key]=typeof fx[key]==='number'&&!['sal','adv','reveal'].includes(key)?Math.round(fx[key]*k):fx[key];return o;}
function fxMerge(a,b){const o=Object.assign({},a);for(const k in b)o[k]=typeof b[k]==='number'&&typeof o[k]==='number'?o[k]+b[k]:b[k];return o;}
// what each tier does: crit = success x2 + 1 Hype, mixed = success + the event's (or option's) cost, fumble = failure + the event's fumble
function tierFx(o,tier,E){if(o.out)return o.out[tier]||{};
 const win=o.win||{},lose=o.lose||{};
 return tier==='crit'?fxMerge(fxScale(win,2),{hype:1}):tier==='succ'?win:tier==='mixed'?fxMerge(win,o.cost||E.cost):tier==='fail'?lose:fxMerge(lose,E.fumble);}

 if(fx.money)ch(fx.money,`${fx.money>0?'+':'−'}${money(Math.abs(fx.money))}`);if(fx.trust)ch(fx.trust,`Sponsor trust ${sgn(fx.trust)}`);
 if(fx.per)ch(fx.per,`${fx.per>0?'+':'−'}${money(Math.abs(fx.per))} per race (sponsor)`);if(fx.bonus)ch(fx.bonus,`${fx.bonus>0?'+':'−'}${money(Math.abs(fx.bonus))} goal bonus`);
 if(fx.sal!=null){const v=ev&&ev.revealed?`${money(r100(ev.ceil*fx.sal))}/race salary`:`salary ${Math.round(fx.sal*100)}% of their ceiling`;ch(fx.sal>=0.6?1:fx.sal>=0.35?0:-1,v);}
 if(fx.mom)ch(fx.mom,`+${fx.mom} Momentum next green flag`);if(fx.clause)ch(1,`Clause: ${CLAUSE_N[fx.clause]||fx.clause}`);if(fx.adv)ch(1,'Advantage on the next question');if(fx.reveal)ch(1,'Learn their budget');

 if(o.auto)return `<div class="panel evopt" data-o="${o.id}"><div class="row" style="justify-content:space-between"><b>${esc(o.n)}</b><span class="row" style="gap:4px">${toneChips(o.tone)}</span></div><p class="say">${esc(o.say)}</p><p class="muted" style="font-size:13px">No roll. Nothing else changes.</p><button class="btn small" data-opt="${o.id}">${esc(o.n)}</button></div>`;

function renderEvent(){const ev=G.event,el=$('#event');if(!ev)return;const E=EVENTS[ev.id],d=G.drv,r=evRound(ev),c=ev.ctx;

 el.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>evChoose(b.dataset.opt));
 {const h=$('#ev-hype');if(h)h.onclick=()=>{evHypeOn=!evHypeOn;renderEvent();};}

<script id="crew-js">
/* ================= Crew HQ (roadmap step 19) =================
   Four staff: crew chief, spotter and engineer make the radio calls (a risk layer of their own, not part of cards or combos);
   the pit crew works your pit cards and the release window. A member's level is G.stats[role]. Training buys +1 level at the
   driver coaching price (3000 + 1200 per level above 3, a little more than the old crew shop), and XP from the calls you take (stops, for the pit crew) levels them too. Levels 4, 6 and 8 each open a
   two-way perk choice, and levels 6 and 8 unlock that member's bigger calls (Q13, in RADIO_CALLS). Hiring brings in a better
   or different person: a trait, a wage, and perks picked fresh. Crew HQ also sells and upgrades pit cards (Q23).
   A fresh crew has no perks or traits, so default-level harness runs play the same calls as before. */
const CREW_ROLES=['crewChief','spotter','engineer','pitCrew'],CALL_ROLES=['crewChief','spotter','engineer'];
const ROLE={crewChief:{n:'Crew chief',c:'#e9b52f',d:'Strategy and tire calls on the radio. Shorter pit lane times.'},
 spotter:{n:'Spotter',c:'#6ea8ff',d:'Racing calls: lines, blocks and moves. Above level 5 every card also reads a little better.'},
 engineer:{n:'Engineer',c:'#a98bff',d:'Car calls: brake bias, pressures, engine maps.'},
 pitCrew:{n:'Pit crew',c:'#2fb36a',d:'Over the wall: pit card odds and the release window at your stops.'}};
const CREW_TRAIN=l=>3000+1200*Math.max(0,l-3),CREW_XP=l=>60+20*l,CREW_MAX=10;
const CXP={call:3,won:3,stop:4,perfect:4};
const PERKS={
 crewChief:[{lvl:4,a:{id:'tires',n:'Tire whisperer',t:'Crew chief calls pay 25% more.',fx:{pay:0.25}},b:{id:'calm',n:'Calm voice',t:'+3% on every crew call.',fx:{chanceAll:3}}},
  {lvl:6,a:{id:'strategist',n:'Strategist',t:'+1 Prep card at every pit stop.',fx:{prep:1}},b:{id:'motivator',n:'Motivator',t:'Any crew call that works also gives +1 Momentum.',fx:{momAll:1}}},
  {lvl:8,a:{id:'bigpic',n:'Big picture',t:'Crew calls come 15% more often.',fx:{rate:0.85}},b:{id:'safehands',n:'Safe hands',t:'Every missed crew call costs half.',fx:{softAll:2}}}],
 spotter:[{lvl:4,a:{id:'eyes',n:'Eyes up top',t:'+5% on spotter calls.',fx:{chance:5}},b:{id:'chatter',n:'Chatter',t:'Spotter calls come up twice as often.',fx:{weight:2}}},
  {lvl:6,a:{id:'door',n:'Door to door',t:'Spotter calls pay 30% more.',fx:{pay:0.3}},b:{id:'clean',n:'Clean racer',t:'Missed spotter calls cost 60% less.',fx:{soft:2.5}}},
  {lvl:8,a:{id:'again',n:'Second look',t:'After a spotter call works, 35% chance another call comes right away.',fx:{again:0.35}},b:{id:'net',n:'Safety net',t:'Half of your missed spotter calls cost nothing.',fx:{net:0.5}}}],
 engineer:[{lvl:4,a:{id:'data',n:'Data nerd',t:'+5% on engineer calls.',fx:{chance:5}},b:{id:'margins',n:'Safe margins',t:'Missed engineer calls cost half.',fx:{soft:2}}},
  {lvl:6,a:{id:'overdrive',n:'Overdrive',t:'Engineer calls pay 30% more.',fx:{pay:0.3}},b:{id:'cool',n:'Cool running',t:'An engineer call that works also repairs 4 damage.',fx:{fixOnS:4}}},
  {lvl:8,a:{id:'opinion',n:'Second opinion',t:'Once a race, a missed crew call is rolled again.',fx:{reroll:1}},b:{id:'telemetry',n:'Telemetry',t:'Engineer calls come up 60% more often.',fx:{weight:1.6}}}],
 pitCrew:[{lvl:4,a:{id:'hands',n:'Quick hands',t:'Tire cards +6%.',fx:{tireOdds:6}},b:{id:'gas',n:'Gas men',t:'Fuel and any-lane cards +6%.',fx:{fuelOdds:6}}},
  {lvl:6,a:{id:'drilled',n:'Drilled',t:'Release window +0.15 s.',fx:{relWin:0.15}},b:{id:'bench',n:'Deep bench',t:'+1 card in every pit hand.',fx:{pitHand:1}}},
  {lvl:8,a:{id:'pitperfect',n:'Pit perfect',t:'Tire and fuel lanes start 0.4 s quicker.',fx:{laneCut:0.4}},b:{id:'bodymen',n:'Body men',t:'Fix the Damage takes 2 s less and fixes 10 more.',fx:{bodymen:1}}}]
};
const CTRAITS={
 steady:{n:'Steady',t:'+5% on their calls (pit crew: pit cards).',fx:{chance:5}},
 gambler:{n:'Gambler',t:'Their calls pay 25% more but land 5% less often.',fx:{pay:0.25,chance:-5},calls:1},
 veteran:{n:'Veteran',t:'Their missed calls cost 30% less.',fx:{soft:1.43},calls:1},
 chatty:{n:'Chatty',t:'Their calls come up 50% more often.',fx:{weight:1.5},calls:1},
 clutch:{n:'Clutch',t:'+12% on their calls in the last 30% of a race.',fx:{late:12},calls:1},
 mentor:{n:'Mentor',t:'The whole crew earns 50% more XP.',fx:{xp:0.5}},
 lightning:{n:'Lightning',t:'Pit cards +5% and release window +0.1 s.',fx:{tireOdds:5,fuelOdds:5,relWin:0.1},pit:1}
};
const CREW_MULT={rate:1,soft:1,softAll:1,weight:1};
const CREW_NAMES=['Dale Pruitt','Rita Okafor','Hank Lowery','Mo Delgado','Teddy Vance','Jo Whitlock','Cal Brennan','Nia Foster','Gus Harlan','Shay Moreno','Boone Ritter','Lena Park','Wes Calloway','Dot Pickens','Ray Tillman','Kit Sorensen'];
// names from the clock, not Math.random, so a new career leaves seeded harness runs untouched
function newCrew(){const o=Date.now()%CREW_NAMES.length,c={};CREW_ROLES.forEach((k,i)=>c[k]={name:CREW_NAMES[(o+i*5)%CREW_NAMES.length],xp:0,trait:null,wage:0,perks:{},since:1});return c;}
function ensureCrew(){if(!G)return;if(G.stats.pitCrew==null)G.stats.pitCrew=G.stats.crewChief;if(!G.crew)G.crew=newCrew();for(const k of CREW_ROLES)if(!G.crew[k])G.crew[k]={name:pick(CREW_NAMES),xp:0,trait:null,wage:0,perks:{}};if(!G.pitDeck)G.pitDeck=[...PIT_DECK0];}
// every active fx entry: chosen perks (tier unlocked by level) and traits, with the role they belong to
function crewList(){const out=[];if(!G||!G.crew)return out;
 for(const k of CREW_ROLES){const m=G.crew[k];if(!m)continue;const lv=G.stats[k]||3;
  PERKS[k].forEach((t,i)=>{const ch=m.perks&&m.perks[i];if(ch&&lv>=t.lvl)out.push([k,t[ch].fx]);});
  if(m.trait&&CTRAITS[m.trait])out.push([k,CTRAITS[m.trait].fx]);}
 return out;}
function crewFx(key,role){const mul=key in CREW_MULT;let v=mul?1:0;
 for(const [k,fx] of crewList()){if(role&&k!==role)continue;const x=fx[key];if(x==null)continue;v=mul?v*x:v+x;}return v;}
function crewLate(){const r=race;if(!r)return false;const m=meCar();return m&&lapOf(m)>=r.track.laps*0.7;}
function crewChance(stat){return crewFx('chance',stat)+crewFx('chanceAll')+(crewLate()?crewFx('late',stat):0);}
function crewPay(stat){return 1+crewFx('pay',stat);}
function crewSoft(stat){return crewFx('soft',stat)*crewFx('softAll');}
function crewWeight(call){return call.stat?crewFx('weight',call.stat):1;}
// more calls with a better crew: -2% gap per level above 3 (talking crew members), times perks
function crewRate(){if(!G||!G.stats)return 1;const a=CALL_ROLES.reduce((s,k)=>s+Math.max(0,(G.stats[k]||3)-3),0)/CALL_ROLES.length;return Math.max(0.5,(1-0.02*a)*crewFx('rate'));}
function crewLaneOdds(lane){return crewFx('chance','pitCrew')+(lane==='tire'?crewFx('tireOdds'):lane==='fuel'||lane==='any'?crewFx('fuelOdds'):0);}
function cxp(role,n){const r=race;if(!r||!role)return;r.crewXp=r.crewXp||{};r.crewXp[role]=(r.crewXp[role]||0)+n;}
function crewAfterCall(call,ok,car){const r=race;r.stats.calls=(r.stats.calls||0)+1;if(ok)r.stats.callsWon=(r.stats.callsWon||0)+1;
 cxp(call.stat,CXP.call+(ok?CXP.won:0));if(!ok)return;
 const m=crewFx('momAll');if(m)mom(m);
 const fx=crewFx('fixOnS',call.stat);if(fx&&car.damage>0)dzFix(car,Math.min(fx,car.damage),'nose');
 const ag=crewFx('again',call.stat);if(ag&&Math.random()<ag)r.radioSoon=2;}
function crewEndRace(res,r){
 if(!G.crew||G._pti!=null)return;
 res.wages=CREW_ROLES.reduce((s,k)=>s+(G.crew[k].wage||0),0)||0;if(!res.wages)delete res.wages;
 const xp=r.crewXp||{};let k=1+crewFx('xp');if(G.drv&&G.drv.attr&&typeof amod==='function')k+=0.1*Math.max(0,amod(G.drv.attr.rapport||10));
 res.crewXp={};res.crewUp=[];res.calls=r.stats.calls||0;res.callsWon=r.stats.callsWon||0;
 for(const role of CREW_ROLES){const n=Math.round((xp[role]||0)*k);if(!n)continue;res.crewXp[role]=n;const m=G.crew[role];m.xp=(m.xp||0)+n;
  while(G.stats[role]<CREW_MAX&&m.xp>=CREW_XP(G.stats[role])){m.xp-=CREW_XP(G.stats[role]);G.stats[role]++;res.crewUp.push(role);}
  if(G.stats[role]>=CREW_MAX)m.xp=Math.min(m.xp,CREW_XP(CREW_MAX));}
}
/* ---- pit crew hooks ---- */
const _pgRelease19=pgRelease;
pgRelease=function(chief){const pg=race&&race.pg2,was=pg&&pg.phase;_pgRelease19(chief);if(pg&&was==='work'&&pg.phase==='done')cxp('pitCrew',CXP.stop+(pg.perfect?CXP.perfect:0));};
const _pgBase19=pgBase;
pgBase=function(c,svc){const o=_pgBase19(c,svc),k=crewFx('laneCut');if(k){if(o.tire)o.tire=Math.max(2.5,o.tire-k);o.fuel=Math.max(1,o.fuel-k);}return o;};
/* ---- pit cards: three new ones, and a + version of every card (Q23) ---- */
Object.assign(PIT_CARDS,{
 lightning_lugs:{n:'Lightning Lugs',lane:'tire',base:58,d:{cs:-3,s:-2.2,n:0,f:2},txt:'Tires −2.2 s',miss:'miss +2 s'},
 gas_man:{n:'Gas Man Pro',lane:'fuel',base:78,safe:1,d:{cs:-1.4,s:-1,n:-0.3},txt:'Fuel −1 s',miss:'never slower'},
 swing_man:{n:'Swing Man',lane:'any',base:80,safe:1,d:{cs:-1,s:-0.7,n:-0.2},txt:'Slowest lane −0.7 s',miss:'never slower'}
});
const PIT_SHOP=['lightning_lugs','gas_man','swing_man'],PIT_BUY=2000,PIT_UP=1500;
const fmtD=v=>(Math.round(Math.abs(v)*10)/10).toString();
for(const id of Object.keys(PIT_CARDS)){const d=PIT_CARDS[id],u={...d,n:d.n+'+',up:1,of:id};
 if(d.base){u.base=Math.min(95,d.base+10);u.d={};for(const k in d.d)u.d[k]=d.d[k]<0?+(d.d[k]*1.25).toFixed(2):+(d.d[k]*0.75).toFixed(2);
  u.txt=d.txt.replace(/−([\d.]+) s/,()=>`−${fmtD(u.d.s)} s`);u.miss=d.safe?d.miss:`miss +${fmtD(u.d.f)} s`;}
 else if(d.setup)u.txt='Installs at Level II';
 PIT_CARDS[id+'+']=u;}
// Fix the Damage reads the Body men perk live
for(const id of ['fix','fix+']){const d=PIT_CARDS[id],base={time:id==='fix'?PG.fixT:3,fix:id==='fix'?20:30};
 Object.defineProperty(d,'time',{get:()=>base.time-(crewFx('bodymen')?2:0),enumerable:true});
 Object.defineProperty(d,'fix',{get:()=>base.fix+(crewFx('bodymen')?10:0),enumerable:true});
 Object.defineProperty(d,'txt',{get:()=>`+${d.time} s · fixes ${d.fix}, worst spot first`,enumerable:true});}
function pitCardHTML(id,i,mode){const d=PIT_CARDS[id];let o='',sub='';
 if(d.base){const p=pcOdds(id);o=`${Math.round((p.s+p.cs)*100)}%`;sub=`${d.txt} · ${d.miss}`;}
 else if(d.setup){o=`+${PG.adjT} s`;sub=d.up?`${SETUPS[d.setup].txt(2)} (Level II)`:SETUPS[d.setup].txt(1);}
 else{o=`+${d.time} s`;sub=d.txt;}
 const lane=d.setup?'adj':d.lane,tag=d.setup?'Setup':d.lane==='any'?'Any lane':LANE_N[d.lane];
 const act=mode==='pick'?'':mode==='shop'?`<button class="btn small" data-pbuy="${id}" ${G.money<PIT_BUY?'disabled':''}>Swap in · ${money(PIT_BUY)}</button>`
  :d.up?'<span class="muted" style="font-size:11px">Upgraded</span>':`<button class="btn small" data-pup="${i}" ${G.money<PIT_UP?'disabled':''}>Upgrade · ${money(PIT_UP)}</button>`;
 return `<${mode==='pick'?'button':'div'} class="pcard ${lane} ${d.up?'plus':''} ${mode==='pick'?'pick':''}" ${mode==='pick'?`data-pswap="${i}"`:''}><span class="eyebrow" style="font-size:10px">${tag}</span><b>${esc(d.n)}</b><span class="o">${o}</span><span class="muted">${esc(sub)}</span>${act}</${mode==='pick'?'button':'div'}>`;}
/* ---- hiring ---- */
function rollHire(){const roles=shuffle([...CREW_ROLES]).slice(0,3),used=new Set(CREW_ROLES.map(k=>G.crew[k].name));
 return roles.map(role=>{const cur=G.stats[role],lvl=clamp(cur+randi(0,2),3,CREW_MAX);
  const tr=pick(Object.keys(CTRAITS).filter(t=>role==='pitCrew'?!CTRAITS[t].calls:!CTRAITS[t].pit));
  let fee=1200;for(let l=cur;l<lvl;l++)fee+=CREW_TRAIN(l)*0.8;
  const name=pick(CREW_NAMES.filter(n=>!used.has(n)));used.add(name);
  return {role,lvl,trait:tr,name,fee:Math.round(fee/100)*100,wage:250*(lvl-2)};});}
function crewHire(){if(!G.hire||G.hire.ri!==G.raceIdx||G.hire.s!==(G.season||1))G.hire={ri:G.raceIdx,s:G.season||1,list:rollHire()};return G.hire.list;}
/* ---- screens ---- */
const crewUI={swap:null};
function crewReady(){let n=0;for(const k of CREW_ROLES){const m=G.crew[k];PERKS[k].forEach((t,i)=>{if(G.stats[k]>=t.lvl&&!(m.perks&&m.perks[i]))n++;});}return n;}
function crewGaragePanel(){ensureCrew();const n=crewReady();
 return `<div class="grid" style="gap:6px"><span class="eyebrow">Crew</span><div class="row" style="justify-content:space-between"><div class="crewsum">${CREW_ROLES.map(k=>`<span>${ROLE[k].n} <b>${G.stats[k]}</b></span>`).join('')}</div><button class="btn small" id="g-crew">Crew HQ${n?` <span class="cbadge">${n}</span>`:''}</button></div><span class="muted" style="font-size:12px">Hire and train staff, pick perks, upgrade pit cards.${n?` ${n} perk choice${n>1?'s':''} waiting.`:''}</span></div>`;}
function callChance(c){return clamp(c.base+G.stats[c.stat]*c.per+relicSum('radioBonus')+crewFx('chance',c.stat)+crewFx('chanceAll'),5,95);}
function staffHTML(k){const m=G.crew[k],R=ROLE[k],lv=G.stats[k],need=CREW_XP(lv),tr=m.trait&&CTRAITS[m.trait];
 let calls;
 if(k==='pitCrew'){const w=0.55+0.07*lv+crewFx('relWin');calls=['quick_jack','fast_fill','lug_gamble'].map(id=>{const p=pcOdds(id);return `<div class="cl"><span>${esc(PIT_CARDS[id].n)}</span><b>${Math.round((p.s+p.cs)*100)}%</b></div>`;}).join('')+`<div class="cl"><span>Release window</span><b>${w.toFixed(2)} s</b></div>`;}
 else calls=RADIO_CALLS.filter(c=>c.stat===k).map(c=>c.lvl&&lv<c.lvl?`<div class="cl lock"><span>🔒 ${esc(c.nm)}</span><span>level ${c.lvl}</span></div>`:`<div class="cl"><span>${c.lvl?'★ ':''}${esc(c.nm)}</span><b>${callChance(c)}%</b></div>`).join('');
 const tiers=PERKS[k].map((t,i)=>{const ch=m.perks&&m.perks[i];return `<div class="ptier"><span>Lv ${t.lvl}</span>${['a','b'].map(x=>{const p=t[x],lock=lv<t.lvl,cls=lock?'lock':ch===x?'on':ch?'off':'ready';
  return `<button class="perk ${cls}" ${lock||ch?'disabled':''} data-perk="${k}|${i}|${x}" title="${esc(p.t)}"><b>${ch===x?'✓ ':''}${esc(p.n)}</b><span class="muted">${esc(p.t)}</span></button>`;}).join('')}</div>`;}).join('');
 const cost=CREW_TRAIN(lv);
 return `<div class="panel cs" style="--rc:${R.c}" data-role="${k}">
  <div class="row" style="justify-content:space-between"><span class="eyebrow">${R.n}</span>${tr?`<span class="trait" title="${esc(tr.t)}">${esc(tr.n)}</span>`:''}</div>
  <div class="row" style="justify-content:space-between;align-items:flex-end"><div class="grid" style="gap:2px"><h3>${esc(m.name)}</h3><span class="muted" style="font-size:12px">${m.wage?`${money(m.wage)} a race${tr?' · '+esc(tr.t):''}`:'Volunteer · no wage'}</span></div><div class="lv">${lv}<small>/10</small></div></div>
  ${lv<CREW_MAX?`<div class="xpb"><i style="width:${Math.min(100,(m.xp||0)/need*100).toFixed(0)}%"></i></div><span class="muted" style="font-size:12px">${m.xp||0} / ${need} XP to level ${lv+1} · ${k==='pitCrew'?'earned at every stop, more for a Perfect Stop':'earned on every call of theirs you take, more when it works'}</span>`:'<span class="muted" style="font-size:12px">Maxed out.</span>'}
  <p class="muted" style="font-size:13px">${esc(R.d)}</p>
  <div class="calls"><span class="eyebrow" style="font-size:10px">${k==='pitCrew'?'At your stops':'Their calls · chance to work'}</span>${calls}</div>
  <div class="ptiers"><span class="eyebrow" style="font-size:10px">Perks · pick one per tier, for good</span>${tiers}</div>
  <button class="btn small" data-train="${k}" ${lv>=CREW_MAX||G.money<cost?'disabled':''}>${lv>=CREW_MAX?'Level 10':`Train to level ${lv+1} · ${money(cost)}`}</button></div>`;}
function showCrewHQ(){ensureCrew();const el=$('#crewhq');$('#garage').innerHTML='';
 const hire=crewHire(),rate=crewRate(),gap=Math.round(28*rate);
 const callAvg=(()=>{const cs=RADIO_CALLS.filter(c=>c.kind==='mech'&&(!c.lvl||G.stats[c.stat]>=c.lvl));return Math.round(cs.reduce((s,c)=>s+callChance(c),0)/cs.length);})();
 const unlocked=RADIO_CALLS.filter(c=>c.lvl&&G.stats[c.stat]>=c.lvl).length,wages=CREW_ROLES.reduce((s,k)=>s+(G.crew[k].wage||0),0);
 const sw=crewUI.swap;
 el.innerHTML=`<div class="page-in">
  <div class="row" style="justify-content:space-between"><div class="grid" style="gap:4px"><span class="eyebrow">Crew HQ · season ${G.season||1} · before race ${G.raceIdx+1} of ${SEASON_LEN}</span><h2>Your crew</h2></div><div class="row"><span class="money">${money(G.money)}</span><button class="btn primary" id="c-back">Back to garage</button></div></div>
  <div class="panel grid" style="gap:8px"><p>Crew calls are risky extra plays on the radio, separate from your cards and combos. A better crew offers them more often, lands them more and pays more, and levels 6 and 8 unlock bigger calls. Spending here instead of on driver coaching is a real way to race.</p>
   <div class="crewsum"><span>A call about every <b>${gap} s</b></span><span>Average call <b>${callAvg}%</b> to work</span><span>Big calls unlocked <b>${unlocked} of 6</b></span><span>Wages <b>${money(wages)}</b> a race</span></div></div>
  <div class="crew-staff">${CREW_ROLES.map(staffHTML).join('')}</div>
  <div class="panel grid" style="gap:10px"><div class="grid" style="gap:2px"><h3>Hire</h3><span class="muted" style="font-size:13px">A hire replaces the person in that seat. They arrive at their level with a trait and a wage, and you pick their perks fresh. New faces every race.</span></div>
