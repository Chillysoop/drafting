name: prototype

on:
  pull_request:
    paths: ['prototype/**', '.github/workflows/prototype.yml']
  push:
    branches: [main]
    paths: ['prototype/**']

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm i -D playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: One headless race per track, no page errors
        run: node prototype/harness/smoke.js "$PWD/prototype/green-flag-deck.html" "$RUNNER_TEMP/title.png"
      - name: Season save/continue check
        run: node prototype/harness/season-smoke.js "$PWD/prototype/green-flag-deck.html"
      - name: Collection and race deck builder check
        run: node prototype/harness/deck-smoke.js "$PWD/prototype/green-flag-deck.html"
      - name: HUD smoke (console, toss bin, tiles)
        run: node prototype/harness/hud-smoke.js "$PWD/prototype/green-flag-deck.html"
      - name: Qualifying check (real screens and keys)
        run: node prototype/harness/quali-smoke.js "$PWD/prototype/green-flag-deck.html"
      - name: Sponsors and race objectives check
        run: node prototype/harness/sponsor-smoke.js "$PWD/prototype/green-flag-deck.html"
      - name: Driver sheet and d20 checks
        run: node prototype/harness/driver-smoke.js "$PWD/prototype/green-flag-deck.html"
      - name: Crew HQ check
        run: node prototype/harness/crew-smoke.js "$PWD/prototype/green-flag-deck.html"
