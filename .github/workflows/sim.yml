name: sim

on:
  pull_request:
    paths: ['sim/**', 'game/Packages/com.greenflag.sim/**', 'game/Packages/com.greenflag.view/**', '.github/workflows/sim.yml']
  push:
    branches: [main]
    paths: ['sim/**', 'game/Packages/com.greenflag.sim/**', 'game/Packages/com.greenflag.view/**']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Sim and view model have no engine references
        run: |
          if grep -rnE '^\s*using\s+Unity(Engine|Editor)' game/Packages/com.greenflag.sim/Runtime game/Packages/com.greenflag.view/Runtime; then
            echo "::error::The sim and the view model must not reference UnityEngine or UnityEditor"; exit 1
          fi
      - name: dotnet test
        run: dotnet test sim/GreenFlag.Sim.sln --logger "trx;LogFileName=sim.trx" --results-directory "$RUNNER_TEMP/sim-tests"
      - name: Headless races, each run twice (same seed must give the same race)
        run: dotnet run --project sim/GreenFlag.Harness -c Release -- check 5
      - name: Parity with the browser slice (every play style within half a place)
        run: |
          set -o pipefail
          dotnet run --project sim/GreenFlag.Harness -c Release --no-build -- parity sim/parity/browser-baseline.json 60 | tee "$RUNNER_TEMP/parity.txt"
      - name: Parity summary
        if: always()
        run: |
          {
            echo '### Parity with the browser slice (C# vs sim-harness-v10.js, 60 races per cell)'
            echo '```'
            sed -n '/^style/,$p' "$RUNNER_TEMP/parity.txt" 2>/dev/null || echo 'parity did not run'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Hands-off summary
        run: |
          {
            echo '### Headless races (hands-off, 50 per track, Normal)'
            echo '```'
            dotnet run --project sim/GreenFlag.Harness -c Release --no-build -- batch 50
            echo '```'
            echo '### Card races (smart bot, Drafter, 20 per track, Normal)'
            echo '```'
            dotnet run --project sim/GreenFlag.Harness -c Release --no-build -- batch 20 all smart drafter
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Race view frames and wreck close-ups (top-down snapshots from the view model)
        run: |
          mkdir -p "$RUNNER_TEMP/frames"
          for t in carver ridge cross bramble lake; do
            dotnet run --project sim/GreenFlag.Harness -c Release --no-build -- frames $t 61 "$RUNNER_TEMP/frames/$t.html" 6
          done
          # step 30: close-ups of the first wrecks of a card-spamming race, as the view plays them out
          for t in mill carver; do
            dotnet run --project sim/GreenFlag.Harness -c Release --no-build -- wrecks $t 61 "$RUNNER_TEMP/frames/wrecks-$t.html" spam 3
          done
      - name: Hand and beats HUD (races played with the mouse only, then with a controller only, through the HUD's layout and input)
        run: |
          {
            echo '### Mouse-only races (step 31 HUD: drag, click, hold to play, toss bin, pit stop clicks)'
            echo '```'
            dotnet run --project sim/GreenFlag.Harness -c Release --no-build -- mouse all 2
            echo '```'
            echo '### Controller-only races (step 32: d-pad focus, A to pick and play, trigger hold, X toss, Y pit, stall with buttons)'
            echo '```'
            dotnet run --project sim/GreenFlag.Harness -c Release --no-build -- pad all 2
            dotnet run --project sim/GreenFlag.Harness -c Release --no-build -- pad carver,ridge,hollow 1 drafter 62 nintendo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for t in carver ridge; do
            dotnet run --project sim/GreenFlag.Harness -c Release --no-build -- hud $t 61 "$RUNNER_TEMP/frames/hud-$t.html" 9
          done
      - name: Career loop (step 34 race, rewards, shop and the next race, through the menus, every race played with the mouse; step 37 adds qualifying and the season)
        run: |
          set -o pipefail
          {
            echo '### Career through the menus: stock cars (Drafter), 10 races'
            echo '```'
            dotnet run --project sim/GreenFlag.Harness -c Release --no-build -- career 10 drafter 1
            echo '```'
            echo '### Karts (Brawler), 7 races (into season 2)'
            echo '```'
            dotnet run --project sim/GreenFlag.Harness -c Release --no-build -- career 7 brawler 1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          dotnet run --project sim/GreenFlag.Harness -c Release --no-build -- menus drafter 3 "$RUNNER_TEMP/frames/career-screens.html"
      - name: Season framework (step 37 qualifying, points, sponsors and objectives, the season wrap, contract offers and promotion)
        run: |
          set -o pipefail
          {
            echo '### A full kart season and the step up (Linepainter, great qualifier), 9 races'
            echo '```'
            dotnet run --project sim/GreenFlag.Harness -c Release --no-build -- career 9 linepainter 2 great
            echo '```'
            echo '### A full stock car season, qualifying skipped (Drafter), 11 races'
            echo '```'
            dotnet run --project sim/GreenFlag.Harness -c Release --no-build -- career 11 drafter 3 skip
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Kart series (step 40, a kart season must pass the harness targets)
        run: |
          set -o pipefail
          {
            echo '### Kart series: races on all four kart circuits, then whole kart seasons through the menus'
            echo '```'
            dotnet run --project sim/GreenFlag.Harness -c Release --no-build -- kartseason 10 3 61
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Saves (step 35, closing and reopening the game after every press must change nothing; old saves load in the tests above)
        run: |
          set -o pipefail
          {
            echo '### Saves: a career straight vs reloaded after every press and race'
            echo '```'
            dotnet run --project sim/GreenFlag.Harness -c Release --no-build -- saves 6 drafter 1 standard
            dotnet run --project sim/GreenFlag.Harness -c Release --no-build -- saves 7 brawler 1 ironman
            dotnet run --project sim/GreenFlag.Harness -c Release --no-build -- saves 9 linepainter 2 standard
            echo '```'
            echo "Sample saves loaded by OldSavesLoadAndPlayOn: $(ls sim/GreenFlag.Sim.Tests/Saves | tr '\n' ' ')"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: race-view-frames
          path: ${{ runner.temp }}/frames
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-test-results
          path: ${{ runner.temp }}/sim-tests
