name: nightly

# A Windows player build of the Unity project in game/, every night and on demand.
# Needs three repository secrets (see docs/unity-setup.md): UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD.
# Without them the build job is skipped and the run says so, instead of failing.

on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC, about 3 AM US Eastern
  workflow_dispatch:
  pull_request:
    paths: ['game/**', '.github/workflows/nightly.yml']

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licence:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity licence secrets are not set yet, so the Windows build is skipped. See docs/unity-setup.md."
          fi

  windows:
    needs: licence
    if: needs.licence.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space for the Unity image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: game/Library
          key: Library-Windows-${{ hashFiles('game/Packages/manifest.json', 'game/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Windows-
      - name: Build version
        id: ver
        run: echo "version=0.1.$(date -u +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: game
          targetPlatform: StandaloneWindows64
          buildName: GreenFlagDeck
          buildMethod: GreenFlag.EditorTools.BuildScript.BuildWindows
          versioning: None
          customParameters: -buildVersion ${{ steps.ver.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: GreenFlagDeck-Windows-${{ steps.ver.outputs.version }}
          path: build/StandaloneWindows64
          retention-days: 14
